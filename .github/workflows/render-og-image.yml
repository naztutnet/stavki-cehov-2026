name: Render OG image

on:
  push:
    branches: [main]
    paths:
      - 'og-image-source.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: rsvg-convert -w 1200 -h 630 og-image-source.svg -o og-image-v6.png
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image-v6.png
          git diff --cached --quiet || git commit -m "Render KinoRates social preview v6"
          git push
