name: Remove Unverified Loggers Once

on:
  push:
    paths:
      - .github/workflows/remove-unverified-loggers-once.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unverified logger rate rows
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),sandbox);
          const before=sandbox.window.KINORATES_DATA;
          if(!Array.isArray(before)||before.length!==424) throw new Error('Expected 424 records before removal');
          const targets=before.filter(r=>r.id===210||r.id===213);
          if(targets.length!==2||targets.some(r=>r.prof!=='Логгер'||r.status!=='check')) throw new Error('Expected logger rows 210 and 213');
          console.log('REMOVING='+JSON.stringify(targets));
          const dailies=before.find(r=>r.id===214);
          if(!dailies||dailies.prof!=='Сборка дейлизов'||dailies.amount!==8000||dailies.status!=='fresh2026') throw new Error('Confirmed dailies row is not in expected state');
          const data=before.filter(r=>r.id!==210&&r.id!==213);
          if(data.length!==422) throw new Error('Expected 422 records after removal');
          if(data.some(r=>r.prof==='Логгер')) throw new Error('Logger rate rows remain');
          const depts=new Set(data.map(r=>r.dept));
          if(depts.size!==23) throw new Error('Department count changed: '+depts.size);
          const counts={};for(const r of data)counts[r.status]=(counts[r.status]||0)+1;
          const verified=(counts.fresh2026||0)+(counts.verified2025||0)+(counts.verified2024||0)+(counts.verified2023||0);
          const review=(counts.check||0)+(counts.newdoc||0);
          if(verified!==255||review!==35||(counts.expired||0)!==51||(counts.archive||0)!==81) throw new Error('Unexpected status totals: '+JSON.stringify({counts,verified,review}));
          const K=['dept','prof','cond','content','unit','amount','amount_text','ot','extra','region','eff','src','status','doc','id'];
          for(const r of data){const keys=Object.keys(r);if(K.some(k=>!keys.includes(k))||keys.length!==K.length)throw new Error('Schema mismatch id '+r.id)}
          const D=K.map(k=>[...new Map(data.map(r=>[JSON.stringify(r[k]),r[k]])).values()]);
          const maps=D.map(vals=>new Map(vals.map((v,i)=>[JSON.stringify(v),i])));
          const R=data.map(r=>K.map((k,i)=>maps[i].get(JSON.stringify(r[k]))));
          const out='/* Canonical KinoRates dataset: '+data.length+' runtime-ready records. */\nwindow.KINORATES_DATA=(()=>{const K='+JSON.stringify(K)+',D='+JSON.stringify(D)+',R='+JSON.stringify(R)+';return R.map(a=>Object.fromEntries(K.map((k,i)=>[k,D[i][a[i]]])));})();\n';
          fs.writeFileSync('rates-data.js',out);
          const verify={window:{}};vm.createContext(verify);vm.runInContext(out,verify);
          const v=verify.window.KINORATES_DATA;
          if(v.length!==422||v.some(r=>r.prof==='Логгер')||!v.find(r=>r.id===214&&r.prof==='Сборка дейлизов'&&r.amount===8000))throw new Error('Repacked verification failed');
          console.log('FINAL='+JSON.stringify({total:v.length,depts:new Set(v.map(r=>r.dept)).size,verified,review,expired:counts.expired,archive:counts.archive,dailies:v.find(r=>r.id===214)}));
          NODE
          node --check rates-data.js
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js
          git commit -m "Remove unverified logger rates"
          git pull --rebase origin main
          git push
