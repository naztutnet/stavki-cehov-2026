name: Cache Bust Once

on:
  push:
    paths:
      - '.github/workflows/cache-bust-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust asset cache
        run: node scripts/cache-bust-once.js
      - name: Validate
        run: |
          grep -q 'app.css?v=20260813-0234' index.html
          grep -q 'app.js?v=20260813-0234' index.html
          node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust frontend asset cache"
          git push
