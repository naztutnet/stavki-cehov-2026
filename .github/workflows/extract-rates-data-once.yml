name: One-shot embedded rate data extraction

on:
  push:
    paths:
      - '.github/workflows/extract-rates-data-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract embedded rates and clean stale metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          matches = [i for i,line in enumerate(lines) if line.startswith('const DATA = [')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one embedded DATA line, found {len(matches)}')

          i = matches[0]
          line = lines[i].rstrip('\r\n')
          if not line.endswith(';'):
              raise SystemExit('Embedded DATA declaration has unexpected ending')
          payload = line[len('const DATA = '):-1]
          data = json.loads(payload)
          if not isinstance(data, list) or len(data) < 300:
              raise SystemExit(f'Unexpected rates dataset size: {len(data) if isinstance(data,list) else "not-list"}')
          ids = [row.get('id') for row in data if isinstance(row, dict)]
          if len(ids) != len(data) or len(ids) != len(set(ids)):
              raise SystemExit('Rate IDs are missing or not unique')

          Path('rates-data.js').write_text(
              'window.KINORATES_DATA = ' + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + ';\n',
              encoding='utf-8'
          )
          lines[i] = "const DATA = window.KINORATES_DATA;if(!Array.isArray(DATA))throw new Error('KinoRates data unavailable');\n"
          text = ''.join(lines)

          marker = '<script src="check-log.js"></script>\n<script>\n'
          replacement = '<script src="check-log.js"></script>\n<script src="rates-data.js"></script>\n<script>\n'
          if text.count(marker) != 1:
              raise SystemExit('Expected main script marker exactly once')
          text = text.replace(marker, replacement, 1)

          if text.count('<meta name="theme-color" content="#E7EBF0">') != 1:
              raise SystemExit('Expected stale theme color exactly once')
          text = text.replace('<meta name="theme-color" content="#E7EBF0">', '<meta name="theme-color" content="#f4f5f2">', 1)

          if text.count('"dateModified": "2026-08-11"') != 1:
              raise SystemExit('Expected previous dateModified exactly once')
          text = text.replace('"dateModified": "2026-08-11"', '"dateModified": "2026-08-12"', 1)

          index.write_text(text, encoding='utf-8')
          print(f'Extracted {len(data)} rate records')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          test -s rates-data.js
          grep -q 'window.KINORATES_DATA' rates-data.js
          grep -q '<script src="rates-data.js"></script>' index.html
          ! grep -q '^const DATA = \[' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rates-data.js
          git commit -m "Extract rate dataset from main HTML [skip ci]"
          git push
