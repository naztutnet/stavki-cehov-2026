name: One-shot semantic rate audit

on:
  push:
    paths:
      - '.github/workflows/audit-rate-content-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect inconsistent document groups
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==420)throw new Error(`expected 420, got ${data?.length}`);
          const docs=[
            'https://kinoprofsoyuz.ru/pip/wp-content/uploads/2025/11/otkrytoe_pismo_2026_zvukovoj_departament_ot_15_10_25.pdf',
            'https://kinoprofsoyuz.ru/pip/wp-content/uploads/2025/12/price_2026_for_print.pdf'
          ];
          const groups=docs.map(doc=>({doc,rows:data.filter(r=>r.doc===doc).map(r=>({id:r.id,dept:r.dept,prof:r.prof,cond:r.cond,content:r.content,unit:r.unit,amount:r.amount,amount_text:r.amount_text,ot:r.ot,extra:r.extra,region:r.region,eff:r.eff,status:r.status,src:r.src}))}));
          fs.writeFileSync('document-issue-details-temp.json',JSON.stringify(groups,null,2)+'\n');
          for(const g of groups){
            console.log('\nDOC',g.doc,'ROWS',g.rows.length);
            for(const r of g.rows)console.log(JSON.stringify({id:r.id,prof:r.prof,cond:r.cond,unit:r.unit,amount:r.amount,eff:r.eff,status:r.status,src:r.src}));
          }
          NODE
      - name: Commit temporary details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add document-issue-details-temp.json
          git commit -m "Inspect KinoRates document inconsistencies [skip ci]"
          git push
