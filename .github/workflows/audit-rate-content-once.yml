name: One-shot final semantic validation

on:
  push:
    paths:
      - '.github/workflows/audit-rate-content-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic integrity
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('rates-data.js','utf8'),c);
          const data=c.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==420)throw new Error(`expected 420, got ${data?.length}`);
          const norm=s=>String(s??'').toLowerCase().replace(/ё/g,'е').replace(/[—–−]/g,'-').replace(/[«»„“”"']/g,'').replace(/\s*\/\s*/g,'/').replace(/\s*-\s*/g,'-').replace(/[(),.:;]+/g,' ').replace(/\s+/g,' ').trim();
          const group=(fn)=>{const m=new Map();for(const r of data){const k=fn(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return [...m.values()].filter(x=>x.length>1)};
          const exact=group(r=>JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k])=>k!=='id'))));
          if(exact.length)throw new Error(`exact duplicate groups: ${exact.map(g=>g.map(r=>r.id)).join(';')}`);
          const identity=group(r=>[r.dept,r.prof,r.cond,r.content,r.unit,r.region].map(norm).join('|'));
          const identityDup=identity.filter(g=>new Set(g.map(r=>[r.amount,r.eff,r.src,r.status,r.doc].join('|'))).size>1);
          if(identityDup.length)throw new Error(`identity conflicts: ${identityDup.map(g=>g.map(r=>r.id)).join(';')}`);
          const docGroups=new Map();for(const r of data){if(!r.doc)continue;if(!docGroups.has(r.doc))docGroups.set(r.doc,[]);docGroups.get(r.doc).push(r)}
          const docIssues=[...docGroups.entries()].filter(([,rows])=>new Set(rows.map(r=>r.status)).size>1||new Set(rows.map(r=>r.eff)).size>1||new Set(rows.map(r=>r.src)).size>1);
          if(docIssues.length)throw new Error(`document attribution inconsistencies: ${docIssues.map(([d,rs])=>rs.map(r=>r.id).join(',')).join(';')}`);
          const byId=new Map(data.map(r=>[r.id,r]));
          for(const id of [148,149,210,213])if(byId.get(id)?.doc)throw new Error(`false document attribution returned for ${id}`);
          console.log(JSON.stringify({records:data.length,exact_duplicate_groups:exact.length,identity_conflicts:identityDup.length,document_consistency_issues:docIssues.length,corrected_ids:[148,149,210,213]},null,2));
          NODE
