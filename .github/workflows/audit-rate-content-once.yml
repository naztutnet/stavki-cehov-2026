name: One-shot semantic rate audit

on:
  push:
    paths:
      - '.github/workflows/audit-rate-content-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace suspicious rows before canonical migration
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const ids=new Set([148,149,210,213]);
          function load(text){const c={window:{}};vm.createContext(c);vm.runInContext(text,c);return c.window.KINORATES_DATA}
          const current=load(fs.readFileSync('rates-data.js','utf8')).filter(r=>ids.has(r.id));
          const oldText=cp.execFileSync('git',['show','3653c52d906966caa272dd8c46e5116da2f36c13:rates-data.js'],{encoding:'utf8',maxBuffer:10*1024*1024});
          const old=load(oldText).filter(r=>ids.has(r.id));
          const report={current,pre_migration:old};
          fs.writeFileSync('provenance-trace-temp.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Commit temporary trace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance-trace-temp.json
          git commit -m "Trace KinoRates suspicious provenance [skip ci]"
          git push
