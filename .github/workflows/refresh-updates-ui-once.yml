name: Refresh KinoRates updates readability once

on:
  push:
    paths:
      - '.github/workflows/refresh-updates-ui-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Update news copy and typography
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updates = Path('updates.js')
          text = updates.read_text()
          replacements = {
            'title: "Сверены новые источники и рыночные ориентиры",\n    text: "Добавлены проверенные рыночные данные по стедикаму и локейшен-менеджерам, усилен первоисточник Ассоциации режиссёров монтажа и уточнены условия по звуку, помощникам режиссёра, свету и грипу. Неподтверждённые находки в базу не переносились."':
            'title: "Сверены новые источники",\n    text: "Добавлены ориентиры по стедикаму и локейшен-менеджерам. Уточнены источники и условия по монтажу, звуку, помощникам режиссёра, свету и грипу."',
            'title: "Добавлены рыночные данные по профессиям",\n    text: "В карточках профессий появился отдельный слой рыночных исследований. Он не меняет подтверждённую ставку и показывает год и период данных."':
            'title: "Рыночные данные по профессиям",\n    text: "В карточках появился отдельный слой рыночных исследований с годом и периодом. Подтверждённые ставки он не меняет."',
            'text: "Добавлена официальная сетка рекомендуемых авторских гонораров Гильдии кинодраматургов по форматам и уровням авторов."':
            'text: "Добавлена официальная сетка гонораров Гильдии кинодраматургов по форматам и уровням авторов."',
            'title: "Сверены ставки аэросъёмки АПАК 2025",\n    text: "Обновлены ставки классических и FPV-дронов по оригинальному письму АПАК: модели оборудования, минимальные ставки, переработки и условия работы."':
            'title: "Аэросъёмка АПАК 2025",\n    text: "Сверены ставки классических и FPV-дронов: оборудование, минимумы, переработки и условия работы."'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'updates.js replacement target not found: {old[:60]}')
              text = text.replace(old, new, 1)
          updates.write_text(text)

          css = Path('app.css')
          c = css.read_text()
          old = '.updates-inline .update-meta time{font:600 7.5px var(--mono);color:var(--ink-3);white-space:nowrap}\n.updates-inline .update-type{margin:0;padding:0;border:0!important;background:transparent!important;color:var(--blue)!important;font:700 7px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}\n.updates-inline .update-content h3{display:-webkit-box;margin:0;color:var(--ink);font-size:10.5px;line-height:1.3;letter-spacing:-.01em;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}\n.updates-inline .update-content p{display:-webkit-box;margin:4px 0 0;color:var(--ink-3);font-size:8.5px;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}'
          new = '.updates-inline .update-meta time{font:600 8.5px var(--mono);color:var(--ink-3);white-space:nowrap}\n.updates-inline .update-type{margin:0;padding:0;border:0!important;background:transparent!important;color:var(--blue)!important;font:700 8px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}\n.updates-inline .update-content h3{display:-webkit-box;margin:0;color:var(--ink);font-size:12.5px;line-height:1.28;letter-spacing:-.015em;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}\n.updates-inline .update-content p{display:-webkit-box;margin:5px 0 0;color:var(--ink-2);font-size:10px;line-height:1.42;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}'
          if old not in c:
              raise SystemExit('updates inline CSS target not found')
          c = c.replace(old, new, 1)
          c = c.replace('@media(max-width:600px){.updates-inline-head{padding:7px 9px}.updates-inline .updates-list{grid-auto-columns:minmax(240px,82vw)}.updates-inline .update-item{padding:9px 10px}.updates-inline .update-content h3{font-size:10px}.updates-inline .update-content p{font-size:8.5px}}', '@media(max-width:600px){.updates-inline-head{padding:7px 9px}.updates-inline .updates-list{grid-auto-columns:minmax(250px,86vw)}.updates-inline .update-item{padding:10px 11px}.updates-inline .update-content h3{font-size:12px}.updates-inline .update-content p{font-size:10px}}', 1)
          css.write_text(c)

          index = Path('index.html')
          h = index.read_text()
          old_version = '20260813-1226'
          new_version = '20260813-1514'
          count = h.count(old_version)
          if count < 7:
              raise SystemExit(f'expected unified asset version in at least 7 places, found {count}')
          h = h.replace(old_version, new_version)
          index.write_text(h)
          PY
      - name: Validate
        run: |
          node --check updates.js
          python3 scripts/validate_static.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.js app.css index.html
          git commit -m "Improve KinoRates updates readability"
          git push
