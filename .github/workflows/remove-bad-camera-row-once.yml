name: Remove Bad Camera Row Once
on:
  push:
    paths:
      - '.github/workflows/remove-bad-camera-row-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unsupported legacy row 220
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),c);
          let data=c.window.KINORATES_DATA.map(r=>({...r}));
          const bad=data.find(r=>r.id===220);
          if(!bad) throw new Error('Row 220 not found');
          if(bad.amount!==34000) throw new Error('Unexpected row 220');
          data=data.filter(r=>r.id!==220);
          const K=['dept','prof','cond','content','unit','amount','amount_text','ot','extra','region','eff','src','status','doc','id'];
          const stringIndexes=K.map((_,i)=>i).filter(i=>i!==5&&i!==14),D=[],M=Array(K.length).fill(-1);
          stringIndexes.forEach((fieldIndex,dictIndex)=>{M[fieldIndex]=dictIndex;const vals=[],seen=new Map();for(const row of data){const v=row[K[fieldIndex]];if(v==null)continue;if(!seen.has(v)){seen.set(v,vals.length);vals.push(v)}}D.push(vals)});
          const maps=D.map(arr=>new Map(arr.map((v,i)=>[v,i])));
          const R=data.map(row=>K.map((key,i)=>{const v=row[key];return M[i]>=0&&v!=null?maps[M[i]].get(v):v}));
          fs.writeFileSync('rates-data.js',`/* Canonical KinoRates dataset: ${data.length} runtime-ready records. */\nwindow.KINORATES_DATA=(()=>{const K=${JSON.stringify(K)},D=${JSON.stringify(D)},M=${JSON.stringify(M)},R=${JSON.stringify(R)};return R.map(r=>Object.fromEntries(K.map((k,i)=>[k,M[i]>=0&&r[i]!=null?D[M[i]][r[i]]:r[i]])))})();\n`);
          const counts={};data.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
          const verified=(counts.fresh2026||0)+(counts.official2026||0)+(counts.verified2025||0)+(counts.verified2024||0)+(counts.verified2023||0);
          const review=(counts.check||0)+(counts.newdoc||0);
          if(data.length!==450||verified!==285||review!==16||counts.market2025!==17||counts.expired!==51||counts.archive!==81) throw new Error(JSON.stringify({len:data.length,verified,review,counts}));
          console.log({len:data.length,verified,review,market:counts.market2025,expired:counts.expired,archive:counts.archive});
          NODE
          python3 - <<'PY'
          from pathlib import Path
          p=Path('updates.js');s=p.read_text(encoding='utf-8')
          entry='''  {\n    date: "2026-08-13",\n    dateLabel: "13 августа 2026",\n    type: "data",\n    title: "Уточнён операторский раздел",\n    text: "Удалена неподтверждённая рекламная позиция 34 000 ₽, которая в старой версии базы была ошибочно связана с письмом вторых операторов и камераменов 2024 года."\n  },\n'''
          if 'Уточнён операторский раздел' not in s:
              s=s.replace('window.KINORATES_UPDATES = [\n','window.KINORATES_UPDATES = [\n'+entry,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check rates-data.js
          node --check updates.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js updates.js
          git commit -m "Remove unsupported legacy camera rate"
          git push
