name: One-shot duplicate CSS cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-index-overrides-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove fully overridden legacy CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (''':root{
            --paper:#E7EBF0; --card:#FDFEFF; --ink:#0F1720; --ink-2:#4A5A68; --ink-3:#7C8B98;
            --rule:#C4D0DA; --rule-hard:#94A6B4; --blue:#17456B; --blue-soft:#DCE7F1;
            --ok:#0E6B4F; --warn:#8A5E10; --info:#1F5C8A; --bad:#9A2A2A;
            --ok-bg:#DBEFE5; --warn-bg:#F6ECD3; --info-bg:#DEEAF4; --bad-bg:#F5DEDE;
            --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            --disp:"Oswald","Arial Narrow",Arial,sans-serif;
            --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
          }
          ''', ''),
              ('''body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
            background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px;background-attachment:fixed;
            background-blend-mode:multiply}
          ''', 'body{color:var(--ink);font-family:var(--body);line-height:1.45}\n'),
              ('body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.72;pointer-events:none;z-index:0}\n', ''),
              ('.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 20px 80px}\n', '.wrap{position:relative;z-index:1}\n'),
              ('header{padding:34px 0 18px;border-bottom:2px solid var(--ink)}\n', ''),
              ('.lede{max-width:62ch;color:var(--ink-2);margin:16px 0 0}\n', ''),
              ('.stats{display:flex;flex-wrap:wrap;gap:0;margin:22px 0 0;border-top:1px solid var(--rule-hard)}\n', ''),
              ('.stat{flex:1 1 160px;padding:12px 16px 12px 0;border-right:1px solid var(--rule-hard)}\n', ''),
              ('.controls{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule-hard);padding:12px 0 10px;margin-bottom:0}\n', '.controls{position:sticky;z-index:20}\n'),
              ('.row1{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n', ''),
              ('.layout{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:26px;align-items:start;margin-top:18px}\n', ''),
              ('tbody tr.r:hover{background:var(--blue-soft)}\n', ''),
              ('.dept{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-2);text-transform:uppercase;max-width:190px}\n', ''),
              ('.est{position:sticky;top:97px;background:var(--card);border:2px solid var(--ink)}\n', ''),
              ('body::before{display:none}\n', ''),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove fully overridden legacy CSS [skip ci]"
          git push
