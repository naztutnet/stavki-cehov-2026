name: Update Source Methodology Copy Once

on:
  push:
    paths:
      - '.github/workflows/add-research-strip-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clarify homepage source methodology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='  <p class="eyebrow">Межрегиональный профсоюз кинематографистов · реестр «Точно продюсер» · сверка 30.07.2026</p>'
          new='  <p class="eyebrow">KinoRates · ревизия базы 13.08.2026</p>'
          if old in s:
              s=s.replace(old,new,1)
          old_lede='  <p class="lede">Данные из двух источников объединены в единую базу: справочника МПК и реестра сообщества «Точно продюсер». Ставки шести цехов актуализированы по цеховым письмам 2026 года и отмечены зелёным. Позиции, отмеченные жёлтым или синим, требуют дополнительной проверки.</p>'
          new_lede='  <p class="lede">Основная база собрана из справочника МПК и реестра «Точно продюсер». После ревизии ставки разделены по уровню подтверждения: первоисточники, позиции на проверке, истёкшие документы и архивные ориентиры. Рыночные исследования показаны отдельно и не подменяют официальные ставки.</p>'
          if old_lede not in s:
              raise SystemExit('lede marker not found')
          s=s.replace(old_lede,new_lede,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q 'Рыночные исследования показаны отдельно' index.html
          grep -q 'ревизия базы 13.08.2026' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify source methodology on homepage"
          git push
