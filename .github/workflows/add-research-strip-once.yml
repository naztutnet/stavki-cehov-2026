name: Audit Unresolved Rates Once

on:
  push:
    paths:
      - '.github/workflows/add-research-strip-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export unresolved rates
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};vm.createContext(context);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),context,{filename:'rates-data.js'});
          const data=context.window.KINORATES_DATA;
          const unresolved=data.filter(r=>r.status==='check'||r.status==='newdoc');
          const producers=data.filter(r=>r.id>=230&&r.id<=244);
          fs.writeFileSync('unresolved-rates-temp.json',JSON.stringify({total:data.length,unresolved_count:unresolved.length,unresolved,producers},null,2));
          console.log(`Exported ${unresolved.length} unresolved rows; producer slice ${producers.length}`);
          NODE
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unresolved-rates-temp.json
          git commit -m "Export unresolved rates for source audit"
          git push
