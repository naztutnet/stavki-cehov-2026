name: One-shot DOM reference audit

on:
  push:
    paths:
      - '.github/workflows/audit-dom-refs-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit static DOM references
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          static_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',html))
          refs=set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)',js))
          missing=sorted(refs-static_ids)

          # Static selectors that clearly require a fixed HTML target.
          selectors=set(re.findall(r'querySelector\(["\']([^"\']+)["\']\)',js))
          report={
            'static_id_count':len(static_ids),
            'getElementById_refs':len(refs),
            'missing_getElementById':missing,
            'query_selectors':sorted(selectors),
          }
          Path('dom-audit-temp.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dom-audit-temp.json
          git commit -m "Add temporary DOM reference audit [skip ci]"
          git pull --rebase origin main
          git push
