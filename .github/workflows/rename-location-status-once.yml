name: Rename location status once

on:
  push:
    paths:
      - '.github/workflows/rename-location-status-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rename location document status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app=Path('app.js')
          s=app.read_text()
          s=s.replace('expired:"архивный документ"','expired:"письмо 2024"',1)
          s=s.replace("expired:'Исторический документ'","expired:'Письмо 2024'",1)
          app.write_text(s)

          src=Path('sources-data.js')
          t=src.read_text()
          t=t.replace('Гильдия продюсеров и локейшен-менеджеров (срок истёк 31.01.2026)','Гильдия продюсеров и локейшен-менеджеров — письмо 2024',1)
          src.write_text(t)

          index=Path('index.html')
          h=index.read_text()
          import re
          versions=re.findall(r'\?v=(20260813-\d+)',h)
          if not versions:
              raise SystemExit('asset version not found')
          old=versions[0]
          if any(v!=old for v in versions):
              raise SystemExit('asset versions are not unified')
          new='20260813-1528'
          h=h.replace(old,new)
          index.write_text(h)
          PY
      - name: Validate
        run: |
          node --check app.js
          python3 scripts/validate_static.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sources-data.js index.html
          git commit -m "Rename location document status"
          git push
