name: Fix Historical Label Once

on:
  push:
    paths:
      - '.github/workflows/fix-historical-label-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old='<div class="stat bad"><b>${cnt(\'expired\')}</b><i>по истёкшему документу</i></div>'
          new='<div class="stat bad"><b>${cnt(\'expired\')}</b><i>исторические ставки</i></div>'
          if old not in s: raise SystemExit('stats label not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Rename expired rates as historical"
          git push
