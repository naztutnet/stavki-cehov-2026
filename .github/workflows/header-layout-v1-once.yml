name: Header Layout V1 Once

on:
  push:
    paths:
      - '.github/workflows/header-layout-v1-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply first-screen layout
        run: node scripts/header-layout-v1-once.js
      - name: Validate
        run: |
          node --check app.js
          node --check rates-data.js
          grep -q 'header-guides' index.html
          grep -q 'first screen layout v1' app.css
          ! grep -q 'research-strip' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js app.css
          git commit -m "Simplify KinoRates first screen"
          git push
