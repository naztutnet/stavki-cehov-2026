name: One-shot rate record duplicate audit

on:
  push:
    paths:
      - '.github/workflows/audit-rate-records-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit rate dataset
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict, Counter
          from pathlib import Path

          raw=Path('rates-data.js').read_text(encoding='utf-8')
          prefix='window.KINORATES_DATA = '
          data=json.loads(raw[len(prefix):].strip()[:-1])

          exact=defaultdict(list)
          semantic=defaultdict(list)
          identity=defaultdict(list)
          for row in data:
              exact_key=json.dumps({k:v for k,v in row.items() if k!='id'},ensure_ascii=False,sort_keys=True,separators=(',',':'))
              exact[exact_key].append(row['id'])
              semantic_key=(row.get('dept'),row.get('prof'),row.get('cond'),row.get('content'),row.get('unit'),row.get('amount'),row.get('eff'),row.get('doc'))
              semantic[semantic_key].append(row['id'])
              identity_key=(row.get('dept'),row.get('prof'),row.get('cond'),row.get('content'),row.get('unit'),row.get('eff'))
              identity[identity_key].append({'id':row['id'],'amount':row.get('amount'),'status':row.get('status'),'doc':row.get('doc')})

          exact_groups=[ids for ids in exact.values() if len(ids)>1]
          semantic_groups=[ids for ids in semantic.values() if len(ids)>1 and ids not in exact_groups]
          identity_conflicts=[]
          for key,rows in identity.items():
              amounts={r['amount'] for r in rows}
              if len(rows)>1 and len(amounts)>1:
                  identity_conflicts.append({'key':key,'rows':rows})

          report={
              'record_count':len(data),
              'unique_id_count':len({row['id'] for row in data}),
              'status_counts':dict(Counter(row.get('status') for row in data)),
              'exact_duplicate_groups':exact_groups,
              'semantic_duplicate_groups':semantic_groups,
              'same_identity_different_amount_groups':identity_conflicts,
          }
          Path('data-audit-temp.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-audit-temp.json
          git commit -m "Add temporary KinoRates data audit [skip ci]"
          git push
