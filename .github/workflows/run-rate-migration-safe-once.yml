name: One-shot safe verified rates migration

on:
  push:
    paths:
      - '.github/workflows/run-rate-migration-safe-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse validated migration logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/audit-check-groups-once.yml').read_text(encoding='utf-8')
          start=text.index("          node - <<'NODE'\n") + len("          node - <<'NODE'\n")
          end=text.index("\n          NODE", start)
          lines=text[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/migrate-rates.js').write_text(code,encoding='utf-8')
          PY
          node /tmp/migrate-rates.js
          node --check rates-data.js
      - name: Commit rate data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js
          git commit -m "Verify and update KinoRates source-backed rates [skip ci]"
          git pull --rebase origin main
          git push
