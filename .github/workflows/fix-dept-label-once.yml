name: Fix Department Label Once

on:
  push:
    paths:
      - .github/workflows/fix-dept-label-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Russian grammar in stats label
        run: |
          python3 -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(encoding="utf-8"); old="цехов и департаментов</i></div>"; new="цеха и департамента</i></div>"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          node --check app.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix department count grammar"
          git pull --rebase origin main
          git push
