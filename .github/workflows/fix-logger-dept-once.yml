name: Fix Logger Department Once

on:
  push:
    paths:
      - .github/workflows/fix-logger-dept-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct logger and montage department provenance
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),sandbox);
          const data=sandbox.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==424) throw new Error('Expected 424 records');
          const loggers=[210,213].map(id=>data.find(r=>r.id===id));
          if(loggers.some(r=>!r||r.prof!=='Логгер')) throw new Error('Logger records 210/213 not found as expected');
          console.log('LOGGER_BEFORE='+JSON.stringify(loggers));
          let renamed=0;
          for(const r of data){if(r.dept==='Режиссёр монтажа'){r.dept='Монтажный цех';renamed++;}}
          if(!renamed) throw new Error('No montage department records found');
          for(const r of loggers){
            r.dept='Монтажный цех';
            r.status='check';
            r.doc='';
            if(/монтаж|АРМ/i.test(String(r.src||''))) r.src='Реестр «Точно продюсер» (07.02.2025)';
            r.eff='07.02.2025';
            const note='Ставка логгера требует дополнительной проверки по первичному источнику; мониторинг ставок АРМ на 2026 год не содержит отдельной позиции «Логгер».';
            if(!String(r.extra||'').includes('мониторинг ставок АРМ на 2026 год')) r.extra=(r.extra?String(r.extra).trim()+' ':'')+note;
          }
          const depts=new Set(data.map(r=>r.dept));
          if(depts.has('Режиссёр монтажа')) throw new Error('Legacy montage department remains');
          if(!depts.has('Монтажный цех')) throw new Error('Montage department missing');
          if(depts.size!==23) throw new Error('Department count changed: '+depts.size);
          if(loggers.some(r=>r.dept!=='Монтажный цех'||r.status!=='check'||r.doc!=='')) throw new Error('Logger correction failed');
          console.log('LOGGER_AFTER='+JSON.stringify(loggers));
          const K=['dept','prof','cond','content','unit','amount','amount_text','ot','extra','region','eff','src','status','doc','id'];
          for(const r of data){const keys=Object.keys(r);if(K.some(k=>!keys.includes(k))||keys.length!==K.length)throw new Error('Schema mismatch id '+r.id)}
          const D=K.map(k=>[...new Map(data.map(r=>[JSON.stringify(r[k]),r[k]])).values()]);
          const maps=D.map(vals=>new Map(vals.map((v,i)=>[JSON.stringify(v),i])));
          const R=data.map(r=>K.map((k,i)=>maps[i].get(JSON.stringify(r[k]))));
          const out='/* Canonical KinoRates dataset: '+data.length+' runtime-ready records. */\nwindow.KINORATES_DATA=(()=>{const K='+JSON.stringify(K)+',D='+JSON.stringify(D)+',R='+JSON.stringify(R)+';return R.map(a=>Object.fromEntries(K.map((k,i)=>[k,D[i][a[i]]])));})();\n';
          fs.writeFileSync('rates-data.js',out);
          const verify={window:{}};vm.createContext(verify);vm.runInContext(out,verify);
          const v=verify.window.KINORATES_DATA;
          if(v.length!==424||v.find(r=>r.id===210).dept!=='Монтажный цех'||v.find(r=>r.id===213).doc!=='')throw new Error('Repacked data verification failed');
          NODE
          node --check rates-data.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js
          git commit -m "Move loggers to montage department"
          git pull --rebase origin main
          git push
