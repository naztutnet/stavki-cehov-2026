name: Audit Remaining Rates Once

on:
  push:
    paths:
      - '.github/workflows/audit-remaining-once.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export unresolved rows
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),c);
          const rows=c.window.KINORATES_DATA.filter(r=>['check','newdoc'].includes(r.status));
          fs.writeFileSync('audit-remaining-temp.json',JSON.stringify(rows,null,2)+'\n');
          const compact=rows.map(r=>[r.id,r.status,r.dept,r.prof,r.cond,r.unit,r.amount_text||r.amount,r.ot,r.src,r.doc].join(' | ')).join('\n')+'\n';
          fs.writeFileSync('audit-remaining-compact-temp.txt',compact);
          console.log(compact);
          if(rows.length!==17)throw new Error(`Expected 17 unresolved rows, got ${rows.length}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-remaining-temp.json audit-remaining-compact-temp.txt
          git commit -m "Export compact unresolved rate rows for audit" || true
          git push
