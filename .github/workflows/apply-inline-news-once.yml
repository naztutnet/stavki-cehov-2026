name: Apply compact inline KinoRates updates once

on:
  push:
    paths:
      - '.github/workflows/apply-inline-news-once.yml'

permissions:
  contents: write

concurrency:
  group: kinorates-inline-updates-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply compact updates patch
        run: python3 scripts/apply_inline_news.py
      - name: Validate
        run: |
          node --check app.js
          node --check updates.js
          node scripts/validate_data.js
          node scripts/test_core.js
          python3 scripts/validate_static.py
          grep -q 'class="updates-inline"' index.html
          grep -q 'updates.js?v=20260813-1226' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css
          git commit -m "Show KinoRates updates in compact header strip"
          git push
