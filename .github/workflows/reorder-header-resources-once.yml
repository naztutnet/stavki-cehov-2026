name: Reorder Header Resources Once

on:
  push:
    paths:
      - '.github/workflows/reorder-header-resources-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorder header resources
        run: node scripts/reorder-header-resources-once.js
      - name: Validate
        run: |
          node --check app.js
          grep -q 'resource shelf readable titles v5' app.css
          grep -q 'app.css?v=20260813-0302' index.html
          grep -q 'Как применять ставки' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css
          git commit -m "Reorder and widen header resource links"
          git push
