name: Refine Select Controls Once

on:
  push:
    paths:
      - '.github/workflows/refine-select-controls-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine select arrows and control heights
        run: node scripts/refine-select-controls-once.js
      - name: Validate
        run: |
          grep -q 'unified selects and filter controls v6' app.css
          grep -q 'background-position:right 12px center' app.css
          grep -q 'app.css?v=20260813-0307' index.html
          node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css index.html
          git commit -m "Refine filter controls and select arrows"
          git push
