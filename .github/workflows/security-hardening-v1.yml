name: KinoRates security hardening v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-hardening-v1.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ('<meta name="theme-color" content="#E7EBF0">', '<meta name="theme-color" content="#E7EBF0">\n<meta name="referrer" content="strict-origin-when-cross-origin">'),
            ('<form class="feedback-form" id="feedbackForm">', '<form class="feedback-form" id="feedbackForm">\n      <input type="text" id="feedbackWebsite" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" value="">'),
            ("const feedbackDialog=document.getElementById('feedbackDialog');\nfunction openFeedback(){if(typeof feedbackDialog.showModal==='function')feedbackDialog.showModal();else feedbackDialog.setAttribute('open','')}", "const feedbackDialog=document.getElementById('feedbackDialog'),feedbackCooldownKey='kinorates_feedback_last_sent';\nlet feedbackOpenedAt=0;\nfunction openFeedback(){feedbackOpenedAt=Date.now();if(typeof feedbackDialog.showModal==='function')feedbackDialog.showModal();else feedbackDialog.setAttribute('open','')}") ,
            ("  const form=e.currentTarget,button=form.querySelector('.feedback-submit'),status=document.getElementById('feedbackStatus');\n  const type=document.getElementById('feedbackType').value,email=document.getElementById('feedbackEmail').value.trim(),message=document.getElementById('feedbackText').value.trim();\n  button.disabled=true;button.textContent='Отправляем…';status.className='feedback-status';status.textContent='';", "  const form=e.currentTarget,button=form.querySelector('.feedback-submit'),status=document.getElementById('feedbackStatus');\n  const type=document.getElementById('feedbackType').value,email=document.getElementById('feedbackEmail').value.trim(),message=document.getElementById('feedbackText').value.trim(),honeypot=document.getElementById('feedbackWebsite').value.trim();\n  let lastSent=0;try{lastSent=Number(localStorage.getItem(feedbackCooldownKey)||0)}catch(_){}\n  if(honeypot||Date.now()-feedbackOpenedAt<1500||Date.now()-lastSent<30000){status.className='feedback-status error';status.textContent='Не удалось отправить сообщение. Попробуйте ещё раз через минуту.';return}\n  button.disabled=true;button.textContent='Отправляем…';status.className='feedback-status';status.textContent='';"),
            ("body:JSON.stringify({_subject:`Ставки цехов — ${type}`,type,email,message,page:location.href})", "body:JSON.stringify({_subject:`Ставки цехов — ${type}`,type,email,message,page:location.origin+location.pathname,_honey:''})"),
            ("status.className='feedback-status ok';status.textContent='Сообщение отправлено. Спасибо!';form.reset();button.textContent='Отправлено ✓';", "status.className='feedback-status ok';status.textContent='Сообщение отправлено. Спасибо!';try{localStorage.setItem(feedbackCooldownKey,String(Date.now()))}catch(_){}form.reset();button.textContent='Отправлено ✓';")
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Expected fragment not found: '+old[:120])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/security-hardening-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/security-hardening-v1.yml
          git commit -m "Harden feedback form and referrer policy"
          git push
