name: Reorder Stats Once

on:
  push:
    paths:
      - .github/workflows/reorder-stats-once.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap first two stats cards
        run: |
          python3 -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(encoding="utf-8"); a="  <div class=\"stat\"><b>${DATA.length}</b><i>позиций в базе</i></div>\n  <div class=\"stat\"><b>${depts.length}</b><i>цехов и департаментов</i></div>"; b="  <div class=\"stat\"><b>${depts.length}</b><i>цехов и департаментов</i></div>\n  <div class=\"stat\"><b>${DATA.length}</b><i>позиций в базе</i></div>"; assert a in s; p.write_text(s.replace(a,b,1),encoding="utf-8")'
          node --check app.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Put departments first in stats"
          git pull --rebase origin main
          git push
