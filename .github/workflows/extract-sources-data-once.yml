name: One-shot source data extraction

on:
  push:
    paths:
      - '.github/workflows/extract-sources-data-once.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source registry from application logic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('app.js')
          text = app_path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith('const SRC  = [')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one embedded SRC declaration, found {len(matches)}')

          i = matches[0]
          line = lines[i].rstrip('\r\n')
          if not line.endswith(';'):
              raise SystemExit('Embedded SRC declaration has unexpected ending')
          payload = line[len('const SRC  = '):-1]
          sources = json.loads(payload)
          if not isinstance(sources, list) or len(sources) < 20:
              raise SystemExit(f'Unexpected source registry size: {len(sources) if isinstance(sources, list) else "not-list"}')
          for source in sources:
              if not isinstance(source, dict) or not source.get('name') or not source.get('date'):
                  raise SystemExit('Invalid source registry record')

          Path('sources-data.js').write_text(
              'window.KINORATES_SOURCES = ' + json.dumps(sources, ensure_ascii=False, separators=(',', ':')) + ';\n',
              encoding='utf-8'
          )
          lines[i] = "const SRC=Array.isArray(window.KINORATES_SOURCES)?window.KINORATES_SOURCES.map(s=>({...s})):[];\n"
          app_path.write_text(''.join(lines), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          marker = '<script src="rates-data.js"></script>\n<script src="app.js"></script>'
          replacement = '<script src="rates-data.js"></script>\n<script src="sources-data.js"></script>\n<script src="app.js"></script>'
          if index.count(marker) != 1:
              raise SystemExit(f'Expected script marker once, found {index.count(marker)}')
          index_path.write_text(index.replace(marker, replacement, 1), encoding='utf-8')
          print(f'Extracted {len(sources)} sources')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          node --check sources-data.js
          node --check app.js
          grep -q '<script src="sources-data.js"></script>' index.html
          grep -q 'window.KINORATES_SOURCES' sources-data.js
          ! grep -q '^const SRC  = \[' app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sources-data.js
          git commit -m "Extract source registry from application logic [skip ci]"
          git push
