name: APAC and Status Model Once

on:
  push:
    paths:
      - '.github/workflows/apak-and-status-model-once.yml'
      - 'scripts/apak-status-migrate-once.js'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run migration
        run: node scripts/apak-status-migrate-once.js
      - name: Validate
        run: |
          node --check app.js
          node --check rates-data.js
          node --check updates.js
          node -e "const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('rates-data.js','utf8'),c);const d=c.window.KINORATES_DATA;if(d.length!==449)throw new Error('bad count');if(d.filter(r=>r.dept==='Аэросъёмка'&&r.status==='verified2025').length!==9)throw new Error('bad APAC');if(d.filter(r=>['check','newdoc'].includes(r.status)).length!==6)throw new Error('bad unresolved');"
          grep -q 'Рыночный ориентир · 2025' index.html
          grep -q 'rate-range-note' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js app.js app.css index.html updates.js
          git commit -m "Verify APAC 2025 rates and clarify source statuses"
          git push
