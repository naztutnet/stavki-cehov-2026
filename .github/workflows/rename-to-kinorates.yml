name: Rename FilmRate to KinoRates

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename brand and domain
        shell: bash
        run: |
          set -e
          grep -rlIl --exclude-dir=.git -e 'FilmRate' -e 'FILMRATE' -e 'filmrate.ru' . | while IFS= read -r file; do
            perl -pi -e 's/filmrate\.ru/kinorates.ru/g; s/FilmRate/KinoRates/g; s/FILMRATE/KINORATES/g' "$file"
          done
          printf 'kinorates.ru' > CNAME
          rm -f .github/workflows/rename-to-kinorates.yml
      - name: Commit changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete KinoRates rebrand and domain migration'
            git push
          fi
