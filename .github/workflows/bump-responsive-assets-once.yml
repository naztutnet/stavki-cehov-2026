name: Bump responsive assets once
on:
  push:
    paths:
      - '.github/workflows/bump-responsive-assets-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bump asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='20260813-1540'
          new='20260813-1834'
          if old not in s:
              raise SystemExit('old version not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 scripts/validate_static.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh responsive inspector assets"
          git push
