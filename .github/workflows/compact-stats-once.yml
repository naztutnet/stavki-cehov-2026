name: Compact Stats Once

on:
  push:
    paths:
      - .github/workflows/compact-stats-once.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact stats into one row
        run: |
          python3 -c 'from pathlib import Path; p=Path("app.css"); s=p.read_text(encoding="utf-8"); old=".stats{grid-template-columns:repeat(5,minmax(110px,1fr));grid-column:1/-1}"; new=".stats{grid-template-columns:repeat(6,minmax(0,1fr));grid-column:1/-1}.stats .stat{min-width:0;padding:10px 12px}.stats .stat b{font-size:20px}.stats .stat i{font-size:7.5px;line-height:1.2}"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css
          git commit -m "Compact stats into one row"
          git pull --rebase origin main
          git push
