name: Fix feedback form once

on:
  push:
    paths:
      - '.github/workflows/fix-feedback-once.yml'

permissions:
  contents: write

jobs:
  fix-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch feedback integration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_endpoint = 'https://formsubmit.co/ajax/snegproduction@gmail.com'
          new_endpoint = 'https://formsubmit.co/ajax/1b36541ff7e8949ab6f3d1b9124677d4'
          if old_endpoint not in text:
              raise SystemExit('Old FormSubmit endpoint not found; refusing unexpected edit')
          text = text.replace(old_endpoint, new_endpoint, 1)

          fallback_pattern = re.compile(
              r"function openFeedbackEmail\(type,email,message\)\{.*?\}\n(?=document\.getElementById\('feedbackForm'\))",
              re.S,
          )
          text, fallback_count = fallback_pattern.subn('', text, count=1)
          if fallback_count != 1:
              raise SystemExit(f'Expected to remove one mailto fallback, removed {fallback_count}')

          catch_pattern = re.compile(
              r"\}catch\(error\)\{\s*console\.warn\('Прямая отправка недоступна, открываем почтовое приложение\.',error\);openFeedbackEmail\(type,email,message\);status\.className='feedback-status ok';status\.textContent='Письмо подготовлено в почтовом приложении — осталось нажать «Отправить»\.';button\.disabled=false;button\.textContent='Открыть письмо ещё раз';\s*\}finally\{clearTimeout\(timeout\)\}",
              re.S,
          )
          replacement = "}catch(error){\n    console.warn('Отправка обратной связи не удалась.',error);\n    status.className='feedback-status error';status.textContent='Не удалось отправить сообщение. Попробуйте ещё раз через минуту.';button.disabled=false;button.textContent='Отправить →';\n  }finally{clearTimeout(timeout)}"
          text, catch_count = catch_pattern.subn(replacement, text, count=1)
          if catch_count != 1:
              raise SystemExit(f'Expected to replace one feedback catch block, replaced {catch_count}')

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-feedback-once.yml
          git commit -m "Fix KinoRates feedback form"
          git push origin main
