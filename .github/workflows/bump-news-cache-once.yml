name: Bump KinoRates news cache once

on:
  push:
    paths:
      - '.github/workflows/bump-news-cache-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh unified asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='20260813-1514'
          new='20260813-1518'
          n=s.count(old)
          if n < 7:
              raise SystemExit(f'expected >=7 asset version matches, found {n}')
          p.write_text(s.replace(old,new))
          PY
      - name: Validate
        run: python3 scripts/validate_static.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh KinoRates news cache"
          git push
