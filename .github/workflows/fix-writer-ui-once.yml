name: Fix Writer UI Once

on:
  push:
    paths:
      - '.github/workflows/fix-writer-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix writer table actions and unit order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const o={'месяц':0,'проект':1,'аккорд':2,'серия':3,'смена':4,'полсмены':5,'час':6,'единоразово':7,'человек':8,'минута':9};"
          new="const o={'месяц':0,'проект':1,'сезон':2,'серия':3,'гонорар':4,'договор':5,'аккорд':6,'смена':7,'полсмены':8,'час':9,'единоразово':10,'человек':11,'минута':12};"
          if old not in s: raise SystemExit('unit order marker not found')
          s=s.replace(old,new,1)
          old_action='''      <td>${isScreenwriter(r)?`<a class="rate-source" href="${SCREENWRITER_RATES}" target="_blank" rel="noopener">Ставки ↗</a>`:est.has(r.id)?`<button class="addbtn is-added" data-remove="${r.id}" title="Убрать из сметы" aria-label="Убрать из сметы" aria-pressed="true">−</button>`:`<button class="addbtn" data-add="${r.id}" title="Добавить в смету" aria-label="Добавить в смету" aria-pressed="false">+</button>`}</td>'''
          new_action='''      <td>${est.has(r.id)?`<button class="addbtn is-added" data-remove="${r.id}" title="Убрать из сметы" aria-label="Убрать из сметы" aria-pressed="true">−</button>`:`<button class="addbtn" data-add="${r.id}" title="Добавить в смету" aria-label="Добавить в смету" aria-pressed="false">+</button>`}</td>'''
          if old_action not in s: raise SystemExit('table action marker not found')
          s=s.replace(old_action,new_action,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          node --check app.js
          grep -q "'сезон':2" app.js
          ! grep -q 'Ставки ↗' app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Make writer rates addable from registry table"
          git push
