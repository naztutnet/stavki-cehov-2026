name: Audit Expired Sources Once

on:
  push:
    paths:
      - '.github/workflows/audit-expired-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export expired groups
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('rates-data.js','utf8'),c);
          const rows=c.window.KINORATES_DATA.filter(r=>r.status==='expired');
          const groups=new Map();
          for(const r of rows){const key=r.doc||r.src||'(none)';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
          let out=`expired_total=${rows.length}\ngroups=${groups.size}\n\n`;
          for(const [key,g] of [...groups].sort((a,b)=>b[1].length-a[1].length)){
            out+=`COUNT ${g.length}\nDOC ${g[0].doc||'—'}\nSRC ${g[0].src||'—'}\nEFF ${g[0].eff||'—'}\nDEPTS ${[...new Set(g.map(r=>r.dept))].join(' | ')}\nROWS\n`;
            for(const r of g)out+=`  ${r.id} | ${r.prof} | ${r.cond} | ${r.amount_text}\n`;
            out+='\n';
          }
          fs.writeFileSync('expired-groups-temp.txt',out);
          if(rows.length!==51)throw new Error(`Expected 51 expired, got ${rows.length}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expired-groups-temp.txt
          git commit -m "Export expired source groups for audit"
          git push
