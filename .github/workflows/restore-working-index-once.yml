name: One-shot working index restoration

on:
  push:
    paths:
      - '.github/workflows/restore-working-index-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last working HTML while keeping corrected OG metadata
        run: |
          git show ae197c6:index.html > /tmp/working-index.html
          python3 - <<'PY'
          import re
          from pathlib import Path

          path=Path('/tmp/working-index.html')
          html=path.read_text(encoding='utf-8')
          html,n1=re.subn(r'<meta property="og:image:width" content="\d+">','<meta property="og:image:width" content="1724">',html,count=1)
          html,n2=re.subn(r'<meta property="og:image:height" content="\d+">','<meta property="og:image:height" content="902">',html,count=1)
          if n1!=1 or n2!=1:
              raise SystemExit(f'OG metadata replacement failed: width={n1} height={n2}')
          Path('index.html').write_text(html,encoding='utf-8')

          static_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',html))
          js=Path('app.js').read_text(encoding='utf-8')
          refs=set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)',js))
          missing=sorted(refs-static_ids)
          if missing:
              raise SystemExit(f'Missing static DOM IDs after restoration: {missing}')
          print(f'Restored working HTML with {len(static_ids)} IDs; all {len(refs)} getElementById references resolved')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'id="feedbackDialog"' index.html
          grep -q 'id="estlines"' index.html
          grep -q 'id="updatesOpen"' index.html
          grep -q 'og:image:width" content="1724"' index.html
          grep -q 'og:image:height" content="902"' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore working KinoRates interface after metadata edit [skip ci]"
          git pull --rebase origin main
          git push
