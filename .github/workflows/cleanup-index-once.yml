name: One-shot legacy CSS cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-index-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove proven dead legacy detail-row styles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''tr.detail>td{background:#F4F7FA;border-top:0;padding:0 10px 16px 10px}
          .dwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding-top:2px}
          .dbox h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 4px}
          .dbox p{margin:0;font-size:12.5px;color:var(--ink-2)}
          .dbox a{color:var(--blue)}
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy CSS block, found {count}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove dead legacy detail-row CSS [skip ci]"
          git push
