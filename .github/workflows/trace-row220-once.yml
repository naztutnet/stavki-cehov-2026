name: Trace Row 220 Once
on:
  push:
    paths:
      - '.github/workflows/trace-row220-once.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace original row
        run: |
          git show 8c287633:rates-data.js > /tmp/old-rates.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),c={window:{}};vm.createContext(c);
          vm.runInContext(fs.readFileSync('/tmp/old-rates.js','utf8'),c);
          const r=c.window.KINORATES_DATA.find(x=>x.id===220);
          fs.writeFileSync('trace-row220-temp.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify(r,null,2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trace-row220-temp.json
          git commit -m "Trace original source for camera row 220"
          git push
