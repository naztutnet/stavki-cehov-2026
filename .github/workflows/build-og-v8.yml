name: Build OG preview v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-og-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 1200x630 JPEG from approved preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('og-image-v7.jpg')
          out = Path('og-image-v8.jpg')
          img = Image.open(src).convert('RGB')
          img = img.resize((1200, 630), Image.Resampling.LANCZOS)
          img.save(out, 'JPEG', quality=92, optimize=True, progressive=True)
          print('built', out, Image.open(out).size)
          PY
      - name: Point Open Graph metadata to v8
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://kinorates.ru/og-image-v7.jpg', 'https://kinorates.ru/og-image-v8.jpg')
          s = s.replace('<meta property="og:image:width" content="300"><meta property="og:image:height" content="158">', '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-image-v8.jpg index.html
          git diff --cached --quiet || git commit -m 'Build large social preview v8'
          git push
