name: Build OG preview v9 PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-og-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 1200x630 PNG from approved preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('og-image-v8.jpg')
          out = Path('og-image-v9.png')
          img = Image.open(src).convert('RGB')
          if img.size != (1200, 630):
              img = img.resize((1200, 630), Image.Resampling.LANCZOS)
          img.save(out, 'PNG', optimize=True)
          print('built', out, Image.open(out).size)
          PY
      - name: Point Open Graph metadata to PNG v9
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://kinorates.ru/og-image-v8.jpg', 'https://kinorates.ru/og-image-v9.png')
          s = s.replace('<meta property="og:image:type" content="image/jpeg">', '<meta property="og:image:type" content="image/png">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit PNG preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-image-v9.png index.html
          git diff --cached --quiet || git commit -m 'Use PNG social preview v9'
          git push
