name: One-shot pure Python OG image recompression

on:
  push:
    paths:
      - '.github/workflows/recompress-og-image-once.yml'

permissions:
  contents: write

jobs:
  recompress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Losslessly recompress PNG IDAT stream
        run: |
          python3 - <<'PY'
          import struct, zlib, binascii
          from pathlib import Path

          path=Path('og-image.png')
          original=path.read_bytes()
          sig=b'\x89PNG\r\n\x1a\n'
          if not original.startswith(sig):
              raise SystemExit('Invalid PNG signature')

          chunks=[];pos=8
          while pos < len(original):
              if pos+12 > len(original): raise SystemExit('Truncated PNG')
              length=struct.unpack('>I',original[pos:pos+4])[0]
              ctype=original[pos+4:pos+8]
              data=original[pos+8:pos+8+length]
              crc=original[pos+8+length:pos+12+length]
              if len(data)!=length or len(crc)!=4: raise SystemExit('Truncated PNG chunk')
              chunks.append((ctype,data))
              pos += 12+length
              if ctype==b'IEND': break

          ihdr=next(data for ctype,data in chunks if ctype==b'IHDR')
          width,height=struct.unpack('>II',ihdr[:8])
          idat=b''.join(data for ctype,data in chunks if ctype==b'IDAT')
          raw=zlib.decompress(idat)
          recompressed=zlib.compress(raw,9)

          def chunk(ctype,data):
              crc=binascii.crc32(ctype)
              crc=binascii.crc32(data,crc)&0xffffffff
              return struct.pack('>I',len(data))+ctype+data+struct.pack('>I',crc)

          out=bytearray(sig)
          wrote_idat=False
          for ctype,data in chunks:
              if ctype==b'IDAT':
                  if wrote_idat: continue
                  out += chunk(b'IDAT',recompressed);wrote_idat=True
              else:
                  out += chunk(ctype,data)

          candidate=bytes(out)
          # Re-parse essential invariants and pixel stream before accepting.
          if candidate[:8]!=sig or candidate[12:16]!=b'IHDR': raise SystemExit('Rebuilt PNG invalid')
          new_w,new_h=struct.unpack('>II',candidate[16:24])
          if (new_w,new_h)!=(width,height): raise SystemExit('PNG dimensions changed')
          if zlib.decompress(recompressed)!=raw: raise SystemExit('PNG pixel stream changed')

          print(f'OG image dimensions: {width}x{height}')
          print(f'OG image bytes: {len(original)} -> {len(candidate)}')
          if len(candidate)<len(original):
              path.write_bytes(candidate)
          else:
              print('Existing PNG is already at least as compact; keeping original')
          PY

      - name: Commit only when smaller
        run: |
          if git diff --quiet -- og-image.png; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git commit -m "Losslessly recompress KinoRates OG image [skip ci]"
          git pull --rebase origin main
          git push
