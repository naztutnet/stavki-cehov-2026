name: One-shot source coverage audit

on:
  push:
    paths:
      - '.github/workflows/source-coverage-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export every source-backed verified row
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==424)throw new Error(`Expected 424 records, got ${data?.length}`);
          const verified=new Set(['fresh2026','verified2025','verified2024','verified2023']);
          const rows=data.filter(r=>verified.has(r.status)).sort((a,b)=>(a.doc||'').localeCompare(b.doc||'')||a.id-b.id);
          if(rows.length!==255)throw new Error(`Expected 255 verified rows, got ${rows.length}`);
          if(rows.some(r=>!r.doc))throw new Error('A verified row has no primary document URL');
          fs.writeFileSync('verified-rows-temp.json',JSON.stringify(rows,null,2));
          NODE
      - name: Commit row-level audit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified-rows-temp.json
          git commit -m "Export verified rows for primary-source audit"
          git pull --rebase origin main
          git push
