name: Fix Secondary Stats Once

on:
  push:
    paths:
      - '.github/workflows/fix-stats-secondary-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix secondary stats row
        run: node scripts/fix-stats-secondary-once.js
      - name: Validate
        run: |
          grep -q 'secondary stats row fix' app.css
          grep -q 'app.css?v=20260813-0250' index.html
          node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.css index.html
          git commit -m "Fix secondary statistics row"
          git push
