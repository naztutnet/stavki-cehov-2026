name: Update FilmRate OG description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-og-description.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'Рекомендованные ставки специалистов кинопроизводства России, актуальные цеховые письма и конструктор предварительной сметы.'
          new = 'Ставки киноцехов России, актуальные цеховые письма и конструктор предварительной сметы.'
          # Change only the HTML meta description, Open Graph description, and Twitter description.
          s = s.replace(f'<meta name="description" content="{old}">', f'<meta name="description" content="{new}">')
          s = s.replace(f'<meta property="og:description" content="{old}">', f'<meta property="og:description" content="{new}">')
          s = s.replace(f'<meta name="twitter:description" content="{old}">', f'<meta name="twitter:description" content="{new}">')
          p.write_text(s)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/update-og-description.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-og-description.yml
          git commit -m "Shorten FilmRate social preview description"
          git push
