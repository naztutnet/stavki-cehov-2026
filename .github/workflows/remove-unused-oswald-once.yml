name: One-shot unused font cleanup

on:
  push:
    paths:
      - '.github/workflows/remove-unused-oswald-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove unused Oswald request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          if text.count('Oswald') != 1:
              raise SystemExit(f'Expected Oswald only in font request, found {text.count("Oswald")} occurrences')
          old='https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap'
          new='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap'
          if text.count(old) != 1:
              raise SystemExit('Expected current KinoRates font URL exactly once')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          ! grep -q 'Oswald' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove unused Oswald font request [skip ci]"
          git push
