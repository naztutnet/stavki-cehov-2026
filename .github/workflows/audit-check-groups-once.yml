name: One-shot transport and casting assistant audit

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target rows
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          const transport=data.filter(r=>r.id>=298&&r.id<=323).map(r=>({id:r.id,prof:r.prof,cond:r.cond,amount:r.amount,amount_text:r.amount_text,ot:r.ot,eff:r.eff,status:r.status,src:r.src,doc:r.doc}));
          const casting=data.filter(r=>r.id>=154&&r.id<=162).map(r=>({id:r.id,prof:r.prof,cond:r.cond,content:r.content,unit:r.unit,amount:r.amount,amount_text:r.amount_text,ot:r.ot,eff:r.eff,status:r.status,src:r.src,doc:r.doc}));
          fs.writeFileSync('batch-rows-temp.json',JSON.stringify({transport,casting},null,2)+'\n');
          console.log(JSON.stringify({transport,casting},null,2));
          NODE
      - name: Commit temporary batch audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batch-rows-temp.json
          git commit -m "Inspect transport and casting assistant rates [skip ci]"
          git push
