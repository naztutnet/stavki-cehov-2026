name: One-shot legacy official rate audit

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect legacy official-letter rows
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          if(data.length!==424)throw new Error(`expected 424, got ${data.length}`);
          const ids=[...Array.from({length:16},(_,i)=>24+i),...Array.from({length:8},(_,i)=>69+i),104,105,106,107,154,162,197,198,199,200,219,220,222,223,225,...Array.from({length:9},(_,i)=>332+i)];
          const rows=data.filter(r=>ids.includes(r.id));
          if(rows.length!==48)throw new Error(`expected 48 target rows, got ${rows.length}`);
          fs.writeFileSync('legacy-official-temp.json',JSON.stringify(rows,null,2)+'\n');
          const groups={};for(const r of rows){const k=r.src;groups[k]??=[];groups[k].push({id:r.id,prof:r.prof,cond:r.cond,amount:r.amount,amount_text:r.amount_text,ot:r.ot,status:r.status,eff:r.eff,doc:r.doc})}
          console.log(JSON.stringify(groups,null,2));
          NODE
      - name: Commit temporary legacy audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-official-temp.json
          git commit -m "Inspect legacy official KinoRates records [skip ci]"
          git push
