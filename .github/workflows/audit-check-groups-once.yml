name: One-shot transparent verification counters

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify status labels and homepage statistics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('app.js','utf8');
          const oldLbl='const LBL = {fresh2026:"письмо 2026 ✓", check:"сверить", newdoc:"есть письмо 2026", verified2025:"письмо 2025 ✓", verified2024:"письмо 2024 ✓", verified2023:"письмо 2023 ✓", archive:"данные 2023", expired:"срок истёк"};';
          const newLbl='const LBL = {fresh2026:"письмо 2026 ✓", check:"сверить", newdoc:"сверить PDF", verified2025:"письмо 2025 ✓", verified2024:"письмо 2024 ✓", verified2023:"письмо 2023 ✓", archive:"данные 2023", expired:"срок истёк"};';
          if(!app.includes(oldLbl))throw new Error('Expected LBL block not found');
          app=app.replace(oldLbl,newLbl);
          const oldNewdoc='  newdoc:"Цех выпустил письмо, вступившее в силу в 2026 году, но эту цифру ещё нужно сверить с текстом первоисточника.",';
          const newNewdoc='  newdoc:"Первичный документ найден, но конкретную цифру или категорию ещё нужно сверить с его содержанием.",';
          if(!app.includes(oldNewdoc))throw new Error('Expected newdoc tooltip not found');
          app=app.replace(oldNewdoc,newNewdoc);
          const oldStats='document.getElementById(\'stats\').innerHTML = `\n  <div class="stat"><b>${DATA.length}</b><i>позиций в базе</i></div>\n  <div class="stat"><b>${depts.length}</b><i>цехов и департаментов</i></div>\n  <div class="stat ok"><b>${cnt(\'fresh2026\')}</b><i>сверено по письмам 2026</i></div>\n  <div class="stat"><b>${cnt(\'newdoc\')}</b><i>ждут сверки с письмом 2026</i></div>\n  <div class="stat bad"><b>${cnt(\'expired\')}</b><i>по истёкшему письму</i></div>`;';
          const newStats='const verifiedCount=cnt(\'fresh2026\')+cnt(\'verified2025\')+cnt(\'verified2024\')+cnt(\'verified2023\');\nconst reviewCount=cnt(\'check\')+cnt(\'newdoc\');\ndocument.getElementById(\'stats\').innerHTML = `\n  <div class="stat"><b>${DATA.length}</b><i>позиций в базе</i></div>\n  <div class="stat"><b>${depts.length}</b><i>цехов и департаментов</i></div>\n  <div class="stat ok"><b>${verifiedCount}</b><i>сверено по первоисточникам</i></div>\n  <div class="stat"><b>${reviewCount}</b><i>требуют проверки</i></div>\n  <div class="stat bad"><b>${cnt(\'expired\')}</b><i>по истёкшему документу</i></div>`;';
          if(!app.includes(oldStats))throw new Error('Expected stats block not found');
          app=app.replace(oldStats,newStats);
          fs.writeFileSync('app.js',app);
          NODE
          node --check app.js
      - name: Commit transparent counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Clarify KinoRates verification counters"
          git pull --rebase origin main
          git push
