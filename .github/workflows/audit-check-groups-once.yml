name: One-shot script supervisor overlap audit

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all script supervisor records
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          const rows=data.filter(r=>String(r.prof).toLowerCase().includes('скрипт-супервайзер'));
          fs.writeFileSync('script-all-temp.json',JSON.stringify(rows,null,2)+'\n');
          console.log(JSON.stringify(rows.map(r=>({id:r.id,cond:r.cond,amount:r.amount,ot:r.ot,status:r.status,eff:r.eff,src:r.src})),null,2));
          NODE
      - name: Commit temporary script audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-all-temp.json
          git commit -m "Inspect KinoRates script supervisor records [skip ci]"
          git push
