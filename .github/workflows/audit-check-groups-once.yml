name: One-shot legacy official status cleanup

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reclassify source-backed legacy rates
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==424)throw new Error(`Expected 424, got ${data?.length}`);
          const byId=new Map(data.map(r=>[r.id,r]));
          const get=id=>{const r=byId.get(id);if(!r)throw new Error(`Missing id ${id}`);return r};
          const setStatus=(ids,status)=>{for(const id of ids){const r=get(id);if(r.status!=='check')throw new Error(`Expected check for ${id}, got ${r.status}`);if(!r.doc)throw new Error(`Expected official document for ${id}`);r.status=status}};

          const verified2023=[...Array.from({length:16},(_,i)=>24+i),...Array.from({length:8},(_,i)=>69+i)];
          const verified2024=[104,105,106,107,154,162,197,198,199,200,219,222,223,225];
          const expiredColor=[...Array.from({length:9},(_,i)=>332+i)];
          setStatus(verified2023,'verified2023');
          setStatus(verified2024,'verified2024');
          for(const id of expiredColor){
            const r=get(id);if(r.status!=='check')throw new Error(`Expected check for colorist ${id}`);
            r.status='expired';
            if(!r.extra.includes('31.12.2022'))r.extra=(r.extra+' Документ прямо ограничивает срок действия ценовой политики датой 31.12.2022.').trim();
          }

          // Advertisement rate ID 220 is absent from the linked 2024 collective letter.
          const unsupported=get(220);
          if(unsupported.status!=='check'||unsupported.amount!==34000)throw new Error('Unexpected ID 220 precondition');
          unsupported.src='Требуется первоисточник';
          unsupported.doc='';
          unsupported.eff='';
          unsupported.extra='Ставка 34 000 ₽ требует первичного подтверждения: опубликованное письмо вторых операторов и камераменов с 01.03.2024 не содержит рекламной позиции.';

          const fields=['dept','prof','cond','content','unit','amount','amount_text','ot','extra','region','eff','src','status','doc','id'];
          const rawFields=new Set(['amount','id']);
          const dicts=fields.map(f=>rawFields.has(f)?null:[]),maps=fields.map(f=>rawFields.has(f)?null:new Map());
          const rows=data.map(row=>fields.map((field,i)=>{const v=row[field];if(rawFields.has(field))return v;if(v===null)return null;if(typeof v!=='string')throw new Error(`Bad ${field} id=${row.id}`);const m=maps[i],d=dicts[i];if(!m.has(v)){m.set(v,d.length);d.push(v)}return m.get(v)}));
          const compact=`/* Canonical KinoRates dataset: 424 runtime-ready records. */\nwindow.KINORATES_DATA=(()=>{const K=${JSON.stringify(fields)},D=${JSON.stringify(dicts)},R=${JSON.stringify(rows)};return R.map(r=>{const o={};for(let i=0;i<K.length;i++){const d=D[i],v=r[i];o[K[i]]=d===null?v:(v===null?null:d[v])}return o})})();\n`;
          const test={window:{}};vm.createContext(test);vm.runInContext(compact,test,{filename:'rates-data.js'});
          const out=test.window.KINORATES_DATA;
          if(out.length!==424||new Set(out.map(r=>r.id)).size!==424)throw new Error('Packed dataset invalid');
          const counts={};for(const r of out)counts[r.status]=(counts[r.status]||0)+1;
          const expected={fresh2026:179,check:24,newdoc:13,verified2025:38,verified2024:14,verified2023:24,expired:51,archive:81};
          for(const [k,v] of Object.entries(expected))if(counts[k]!==v)throw new Error(`Unexpected ${k}: ${counts[k]} != ${v}`);
          fs.writeFileSync('rates-data.js',compact);
          console.log(JSON.stringify({records:out.length,status_counts:counts,unsupported_id_220:out.find(r=>r.id===220)},null,2));
          NODE

          node - <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('app.js','utf8');
          const oldLbl='const LBL = {fresh2026:"письмо 2026 ✓", check:"сверить", newdoc:"есть письмо 2026", verified2025:"письмо 2025", archive:"данные 2023", expired:"срок истёк"};';
          const newLbl='const LBL = {fresh2026:"письмо 2026 ✓", check:"сверить", newdoc:"есть письмо 2026", verified2025:"письмо 2025 ✓", verified2024:"письмо 2024 ✓", verified2023:"письмо 2023 ✓", archive:"данные 2023", expired:"срок истёк"};';
          if(!app.includes(oldLbl))throw new Error('LBL block not found');
          app=app.replace(oldLbl,newLbl);
          const oldTip=`const TIP = {
  fresh2026:"Цифра взята из цехового письма 2026 года и сверена 30.07.2026.",
  check:"Цифра из сводного реестра. Более свежего письма не найдено — уточните у цеха.",
  newdoc:"Цех выпустил письмо, вступившее в силу в 2026 году. Цифра здесь — из реестра февраля 2025, откройте письмо и сверьте.",
  verified2025:"Ставка подтверждена опубликованным коллективным письмом 2025 года. Более свежего письма не найдено.",
  archive:"Архивный рыночный ориентир 2023 года. Используйте только как отправную точку и уточняйте ставку у исполнителя.",
  expired:"Срок действия письма закончился. Ставка приведена как ориентир."
};`;
          const newTip=`const TIP = {
  fresh2026:"Ставка подтверждена опубликованным цеховым письмом на сезон 2026 года.",
  check:"Ставка требует дополнительной проверки: нет актуального первоисточника, однозначно подтверждающего эту позицию.",
  newdoc:"Цех выпустил письмо, вступившее в силу в 2026 году, но эту цифру ещё нужно сверить с текстом первоисточника.",
  verified2025:"Ставка подтверждена опубликованным коллективным письмом 2025 года. Более свежего письма на странице цеха не опубликовано.",
  verified2024:"Ставка подтверждена опубликованным коллективным письмом 2024 года. Более свежего письма по этой категории на странице цеха не опубликовано.",
  verified2023:"Ставка подтверждена опубликованным коллективным письмом 2023 года. Более свежего письма по этой категории на странице цеха не опубликовано.",
  archive:"Архивный рыночный ориентир 2023 года. Используйте только как отправную точку и уточняйте ставку у исполнителя.",
  expired:"Срок действия исходного документа закончился. Ставка приведена только как исторический ориентир."
};`;
          if(!app.includes(oldTip))throw new Error('TIP block not found');
          app=app.replace(oldTip,newTip);
          fs.writeFileSync('app.js',app);
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.css')
          s=p.read_text(encoding='utf-8')
          marker='.b-verified2025{background:var(--info-bg);color:var(--info);border:1px solid var(--info)}\n'
          insert=marker+'.b-verified2024,.b-verified2023{background:var(--info-bg);color:var(--info);border:1px solid var(--info)}\n'
          if marker not in s or '.b-verified2024' in s:
              raise SystemExit('Unexpected status badge CSS state')
          p.write_text(s.replace(marker,insert,1),encoding='utf-8')
          PY

          node --check app.js
          node --check rates-data.js
      - name: Commit transparent legacy statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-data.js app.js app.css
          git commit -m "Distinguish verified legacy letters from unchecked rates"
          git pull --rebase origin main
          git push
