name: One-shot final unresolved rate audit

on:
  push:
    paths:
      - '.github/workflows/audit-check-groups-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List true unresolved and new-document rows
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('rates-data.js','utf8'),ctx,{filename:'rates-data.js'});
          const data=ctx.window.KINORATES_DATA;
          if(!Array.isArray(data)||data.length!==424)throw new Error(`Expected 424, got ${data?.length}`);
          const target=data.filter(r=>r.status==='check'||r.status==='newdoc');
          const group=(rows,key)=>{const m=new Map();for(const r of rows){const k=r[key]||'(пусто)';if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return [...m.entries()].map(([name,items])=>({name,count:items.length,ids:items.map(r=>r.id),professions:[...new Set(items.map(r=>r.prof))],docs:[...new Set(items.map(r=>r.doc).filter(Boolean))]})).sort((a,b)=>b.count-a.count)};
          const report={counts:{check:data.filter(r=>r.status==='check').length,newdoc:data.filter(r=>r.status==='newdoc').length},check_by_source:group(data.filter(r=>r.status==='check'),'src'),newdoc_by_source:group(data.filter(r=>r.status==='newdoc'),'src'),rows:target.map(r=>({id:r.id,status:r.status,dept:r.dept,prof:r.prof,cond:r.cond,content:r.content,unit:r.unit,amount:r.amount,amount_text:r.amount_text,ot:r.ot,extra:r.extra,eff:r.eff,src:r.src,doc:r.doc}))};
          fs.writeFileSync('remaining-unverified-temp.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({counts:report.counts,check_by_source:report.check_by_source,newdoc_by_source:report.newdoc_by_source},null,2));
          NODE
      - name: Commit temporary unresolved audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remaining-unverified-temp.json
          git commit -m "Audit remaining unresolved KinoRates records [skip ci]"
          git push
