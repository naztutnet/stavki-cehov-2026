name: One-shot runtime index optimization

on:
  push:
    paths:
      - '.github/workflows/optimize-runtime-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime indexes and remove repeated scans
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('app.js')
          text=path.read_text(encoding='utf-8')

          marker="const writerSource=SRC.find(s=>s.name.includes('Гильдия кинодраматургов'));if(writerSource)writerSource.url=SCREENWRITER_RATES;\n"
          indexes="""const writerSource=SRC.find(s=>s.name.includes('Гильдия кинодраматургов'));if(writerSource)writerSource.url=SCREENWRITER_RATES;
const RATE_BY_ID=new Map(DATA.map(r=>[r.id,r]));
const DEPT_COUNTS=new Map(),STATUS_COUNTS=new Map(),MAIN_SEARCH_BY_ID=new Map(),QUICK_SEARCH_BY_ID=new Map();
DATA.forEach(r=>{
  DEPT_COUNTS.set(r.dept,(DEPT_COUNTS.get(r.dept)||0)+1);
  STATUS_COUNTS.set(r.status,(STATUS_COUNTS.get(r.status)||0)+1);
  MAIN_SEARCH_BY_ID.set(r.id,(r.dept+' '+r.prof+' '+r.cond+' '+r.unit+' '+r.amount_text+' '+r.ot+' '+r.extra).toLowerCase());
  QUICK_SEARCH_BY_ID.set(r.id,(r.dept+' '+r.prof+' '+r.cond+' '+r.content+' '+r.unit).toLowerCase());
});
"""
          if text.count(marker)!=1:
              raise SystemExit(f'Expected index insertion marker once, found {text.count(marker)}')
          text=text.replace(marker,indexes,1)

          replacements=[
            ("const state = {q:'', unit:'', content:'', dept:'', only26:false, sort:'dept', open:new Set()};",
             "const state = {q:'', words:[], unit:'', content:'', dept:'', only26:false, sort:'dept', open:new Set()};"),
            ("const r=saved.custom?sanitizeCustomRecord(saved.r):DATA.find(x=>x.id===Number(saved.id));",
             "const r=saved.custom?sanitizeCustomRecord(saved.r):RATE_BY_ID.get(Number(saved.id));"),
            ("const cnt = s => DATA.filter(r=>r.status===s).length;",
             "const cnt = s => STATUS_COUNTS.get(s)||0;"),
            ("depts.map(d=>`<button class=\"chip\" data-d=\"${d}\" aria-pressed=\"false\">${d}<span class=\"n\">${DATA.filter(r=>r.dept===d).length}</span></button>`).join('');",
             "depts.map(d=>`<button class=\"chip\" data-d=\"${d}\" aria-pressed=\"false\">${d}<span class=\"n\">${DEPT_COUNTS.get(d)||0}</span></button>`).join('');"),
            ("  if(state.q){\n    const h=(r.dept+' '+r.prof+' '+r.cond+' '+r.unit+' '+r.amount_text+' '+r.ot+' '+r.extra).toLowerCase();\n    if(!state.q.split(/\\s+/).every(w=>h.includes(w))) return false;\n  }",
             "  if(state.words.length){\n    const h=MAIN_SEARCH_BY_ID.get(r.id)||'';\n    if(!state.words.every(w=>h.includes(w))) return false;\n  }"),
            ("document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();render()});",
             "document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();state.words=state.q.split(/\\s+/).filter(Boolean);render()});"),
            ("r=DATA.find(x=>x.id===id)","r=RATE_BY_ID.get(id)"),
            ("renderDetail(DATA.find(x=>x.id===id))","renderDetail(RATE_BY_ID.get(id))"),
            ("const r=DATA.find(x=>x.id==b.dataset.quickAdd);","const r=RATE_BY_ID.get(Number(b.dataset.quickAdd));"),
          ]
          expected_counts={
            "const state = {q:'', unit:'', content:'', dept:'', only26:false, sort:'dept', open:new Set()};":1,
            "const r=saved.custom?sanitizeCustomRecord(saved.r):DATA.find(x=>x.id===Number(saved.id));":1,
            "const cnt = s => DATA.filter(r=>r.status===s).length;":1,
            "depts.map(d=>`<button class=\"chip\" data-d=\"${d}\" aria-pressed=\"false\">${d}<span class=\"n\">${DATA.filter(r=>r.dept===d).length}</span></button>`).join('');":1,
            "  if(state.q){\n    const h=(r.dept+' '+r.prof+' '+r.cond+' '+r.unit+' '+r.amount_text+' '+r.ot+' '+r.extra).toLowerCase();\n    if(!state.q.split(/\\s+/).every(w=>h.includes(w))) return false;\n  }":1,
            "document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();render()});":1,
            "r=DATA.find(x=>x.id===id)":2,
            "renderDetail(DATA.find(x=>x.id===id))":1,
            "const r=DATA.find(x=>x.id==b.dataset.quickAdd);":1,
          }
          for old,new in replacements:
              count=text.count(old)
              expected=expected_counts[old]
              if count!=expected:
                  raise SystemExit(f'Expected {expected} matches, found {count}: {old[:100]!r}')
              text=text.replace(old,new)

          old="""function renderQuickCatalog(query=''){
  const words=query.trim().toLowerCase().split(/\\s+/).filter(Boolean);
  const rows=DATA.filter(r=>!isScreenwriter(r)&&r.amount!=null&&words.every(w=>(r.dept+' '+r.prof+' '+r.cond+' '+r.content+' '+r.unit).toLowerCase().includes(w))).slice(0,80);
"""
          new="""function renderQuickCatalog(query=''){
  const words=query.trim().toLowerCase().split(/\\s+/).filter(Boolean),rows=[];
  for(const r of DATA){
    if(rows.length>=80)break;
    if(!isScreenwriter(r)&&r.amount!=null&&words.every(w=>(QUICK_SEARCH_BY_ID.get(r.id)||'').includes(w)))rows.push(r);
  }
"""
          if text.count(old)!=1:
              raise SystemExit(f'Expected quick catalog scan once, found {text.count(old)}')
          text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          node --check app.js
          grep -q 'const RATE_BY_ID=new Map' app.js
          grep -q 'MAIN_SEARCH_BY_ID' app.js
          grep -q 'QUICK_SEARCH_BY_ID' app.js
          ! grep -q 'DATA.find(x=>x.id' app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Optimize KinoRates runtime lookups [skip ci]"
          git push
