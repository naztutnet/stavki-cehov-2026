name: One-shot lazy export library optimization

on:
  push:
    paths:
      - '.github/workflows/lazy-export-libs-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lazy-load export libraries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          external = '''<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" integrity="sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz" crossorigin="anonymous"></script>
          <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js" integrity="sha384-G23ofMOEI98f9UnroUBjDi6Ll55Y5E6bOX4VAMJo0nIbuQRIxzn0g4athUOb58zs" crossorigin="anonymous"></script>
          <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/vfs_fonts.js" integrity="sha384-pv+tpy6KGI5sKXJDf7oGPdvyVNKYXfAmDYpZ3r3PNP0d13PJQ6YMiiAEndd5sU15" crossorigin="anonymous"></script>
          '''
          if text.count(external) != 1:
              raise SystemExit('Expected one eager export-library block')
          text = text.replace(external, '', 1)

          marker = '<script>\n// Аналитика загружается только после явного согласия посетителя.\n'
          loader = '''<script>
          const lazyScriptLoads=new Map();
          function loadScriptOnce(src,integrity){
            if(lazyScriptLoads.has(src))return lazyScriptLoads.get(src);
            const promise=new Promise((resolve,reject)=>{
              const script=document.createElement('script');
              script.src=src;script.crossOrigin='anonymous';script.integrity=integrity;
              script.onload=()=>resolve();
              script.onerror=()=>{lazyScriptLoads.delete(src);reject(new Error(`Не удалось загрузить ${src}`))};
              document.head.appendChild(script);
            });
            lazyScriptLoads.set(src,promise);return promise;
          }
          async function ensureExcelJS(){
            if(window.ExcelJS)return;
            await loadScriptOnce('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz');
            if(!window.ExcelJS)throw new Error('ExcelJS unavailable');
          }
          async function ensurePdfMake(){
            if(window.pdfMake&&window.pdfMake.vfs)return;
            await loadScriptOnce('https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js','sha384-G23ofMOEI98f9UnroUBjDi6Ll55Y5E6bOX4VAMJo0nIbuQRIxzn0g4athUOb58zs');
            await loadScriptOnce('https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/vfs_fonts.js','sha384-pv+tpy6KGI5sKXJDf7oGPdvyVNKYXfAmDYpZ3r3PNP0d13PJQ6YMiiAEndd5sU15');
            if(!window.pdfMake)throw new Error('pdfMake unavailable');
          }
          // Аналитика загружается только после явного согласия посетителя.
          '''
          if text.count(marker) != 1:
              raise SystemExit('Expected one main-script marker')
          text = text.replace(marker, loader, 1)

          old = '''  try{
              if(!window.ExcelJS)throw new Error('ExcelJS unavailable');
          '''
          new = '''  try{
              await ensureExcelJS();
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected one ExcelJS guard')
          text = text.replace(old, new, 1)

          old = "document.getElementById('pdf').addEventListener('click',()=>{\n"
          new = "document.getElementById('pdf').addEventListener('click',async()=>{\n"
          if text.count(old) != 1:
              raise SystemExit('Expected one PDF click handler')
          text = text.replace(old, new, 1)

          old = '''  try{
              if(!window.pdfMake)throw new Error('pdfMake unavailable');
          '''
          new = '''  try{
              await ensurePdfMake();
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected one pdfMake guard')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          grep -q "await ensureExcelJS()" index.html
          grep -q "await ensurePdfMake()" index.html
          ! grep -q '^<script src="https://cdn.jsdelivr.net/npm/exceljs' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lazy-load Excel and PDF export libraries [skip ci]"
          git push
