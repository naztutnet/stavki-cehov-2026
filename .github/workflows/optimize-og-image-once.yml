name: One-shot lossless OG image optimization

on:
  push:
    paths:
      - '.github/workflows/optimize-og-image-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read original PNG dimensions
        id: original
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import struct
          from pathlib import Path
          raw=Path('og-image.png').read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
              raise SystemExit('og-image.png is not a valid PNG')
          width,height=struct.unpack('>II',raw[16:24])
          print(f'width={width}')
          print(f'height={height}')
          print(f'bytes={len(raw)}')
          PY
          file og-image.png

      - name: Losslessly optimize social preview PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq optipng
          optipng -o7 -strip all og-image.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          import os
          raw=Path('og-image.png').read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
              raise SystemExit('Optimized file is not a valid PNG')
          width,height=struct.unpack('>II',raw[16:24])
          expected=(int(os.environ['ORIGINAL_WIDTH']),int(os.environ['ORIGINAL_HEIGHT']))
          if (width,height) != expected:
              raise SystemExit(f'Image dimensions changed: {expected} -> {(width,height)}')
          before=int(os.environ['ORIGINAL_BYTES'])
          after=len(raw)
          print(f'OG image: {width}x{height}, {before} -> {after} bytes')
          if after > before:
              raise SystemExit('Optimizer made file larger')
          PY
        env:
          ORIGINAL_WIDTH: ${{ steps.original.outputs.width }}
          ORIGINAL_HEIGHT: ${{ steps.original.outputs.height }}
          ORIGINAL_BYTES: ${{ steps.original.outputs.bytes }}

      - name: Commit only when smaller
        run: |
          if git diff --quiet -- og-image.png; then
            echo 'Image already optimal enough; nothing to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git commit -m "Losslessly optimize KinoRates OG image [skip ci]"
          git push
