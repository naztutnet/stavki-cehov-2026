name: One-shot CSS cascade audit

on:
  push:
    paths:
      - '.github/workflows/audit-css-cascade-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find fully overridden CSS rules
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          css=Path('app.css').read_text(encoding='utf-8')

          # Strip comments while keeping byte order of rules.
          import re
          css=re.sub(r'/\*.*?\*/','',css,flags=re.S)

          def split_blocks(text, context='root'):
              blocks=[]
              i=0
              while i<len(text):
                  while i<len(text) and text[i].isspace(): i+=1
                  if i>=len(text): break
                  brace=text.find('{',i)
                  if brace<0: break
                  header=text[i:brace].strip()
                  depth=1;j=brace+1
                  while j<len(text) and depth:
                      if text[j]=='{': depth+=1
                      elif text[j]=='}': depth-=1
                      j+=1
                  if depth: raise SystemExit('Unbalanced CSS braces')
                  body=text[brace+1:j-1]
                  if header.startswith('@media') or header.startswith('@supports') or header.startswith('@layer'):
                      blocks.extend(split_blocks(body, header))
                  elif not header.startswith('@'):
                      decls={}
                      for part in body.split(';'):
                          if ':' not in part: continue
                          prop,val=part.split(':',1)
                          prop=prop.strip();val=val.strip()
                          if prop and val: decls[prop]=val
                      blocks.append({'context':context,'selector':header,'decls':decls,'order':len(blocks)})
                  i=j
              return blocks

          rules=split_blocks(css)
          groups={}
          for idx,r in enumerate(rules):
              r['global_order']=idx
              groups.setdefault((r['context'],r['selector']),[]).append(r)

          overridden=[]
          partial=[]
          for (context,selector),items in groups.items():
              if len(items)<2: continue
              for pos,item in enumerate(items[:-1]):
                  later={}
                  for nxt in items[pos+1:]: later.update(nxt['decls'])
                  props=set(item['decls'])
                  covered=sorted(p for p in props if p in later)
                  if props and len(covered)==len(props):
                      overridden.append({'context':context,'selector':selector,'declarations':item['decls'],'later_values':{p:later[p] for p in covered}})
                  elif covered:
                      partial.append({'context':context,'selector':selector,'overridden_properties':covered,'kept_properties':sorted(props-set(covered))})

          report={
              'rule_count':len(rules),
              'fully_overridden':overridden,
              'partially_overridden':partial,
          }
          Path('css-audit-temp.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"rules={len(rules)} fully_overridden={len(overridden)} partial={len(partial)}")
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css-audit-temp.json
          git commit -m "Add temporary CSS cascade audit [skip ci]"
          git push
