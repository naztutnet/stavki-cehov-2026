name: Проверка писем и ставок

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'rates-data.js'
      - 'sources-data.js'
      - 'updates.js'
      - 'check-log.js'
      - 'og-image.png'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/check-rate-sources.yml'
  workflow_dispatch:
    inputs:
      publish_check:
        description: "Добавить запись о проверке в журнал обновлений"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 10 1 * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write
  issues: write

concurrency:
  group: kinorates-source-monitor
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить структуру сайта и данные
        run: |
          node --check app.js
          node --check rates-data.js
          node --check sources-data.js
          node --check updates.js
          node --check check-log.js
          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          app_js = Path('app.js').read_text(encoding='utf-8')

          static_ids = set(re.findall(r'\bid=["\']([^"\']+)["\']', index))
          dom_refs = set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)', app_js))
          missing_dom_ids = sorted(dom_refs - static_ids)
          if missing_dom_ids:
              raise SystemExit(f'app.js ссылается на отсутствующие ID: {missing_dom_ids}')

          data_js = Path('rates-data.js').read_text(encoding='utf-8')
          data_prefix = 'window.KINORATES_DATA = '
          if not data_js.startswith(data_prefix) or not data_js.rstrip().endswith(';'):
              raise SystemExit('Некорректная оболочка rates-data.js')
          data = json.loads(data_js[len(data_prefix):].strip()[:-1])
          if not isinstance(data, list) or len(data) < 300:
              raise SystemExit(f'Подозрительный размер базы: {len(data) if isinstance(data, list) else "not-list"}')
          ids = [row.get('id') for row in data if isinstance(row, dict)]
          if len(ids) != len(data) or len(ids) != len(set(ids)):
              raise SystemExit('В базе отсутствуют ID или найдены дубли ID')

          sources_js = Path('sources-data.js').read_text(encoding='utf-8')
          sources_prefix = 'window.KINORATES_SOURCES = '
          if not sources_js.startswith(sources_prefix) or not sources_js.rstrip().endswith(';'):
              raise SystemExit('Некорректная оболочка sources-data.js')
          sources = json.loads(sources_js[len(sources_prefix):].strip()[:-1])
          if not isinstance(sources, list) or len(sources) < 20:
              raise SystemExit(f'Подозрительный размер реестра источников: {len(sources) if isinstance(sources, list) else "not-list"}')
          if any(not isinstance(source, dict) or not source.get('name') or not source.get('date') for source in sources):
              raise SystemExit('В реестре источников есть некорректная запись')

          css = Path('app.css').read_text(encoding='utf-8')
          depth = 0
          quote = None
          comment = False
          i = 0
          while i < len(css):
              pair = css[i:i+2]
              if comment:
                  if pair == '*/': comment = False; i += 2; continue
                  i += 1; continue
              if not quote and pair == '/*': comment = True; i += 2; continue
              ch = css[i]
              if quote:
                  if ch == '\\': i += 2; continue
                  if ch == quote: quote = None
              else:
                  if ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth < 0: raise SystemExit('Лишняя закрывающая скобка в app.css')
              i += 1
          if comment or quote or depth:
              raise SystemExit('Незакрытая конструкция в app.css')

          og = Path('og-image.png').read_bytes()
          if og[:8] != b'\x89PNG\r\n\x1a\n' or og[12:16] != b'IHDR':
              raise SystemExit('og-image.png не является корректным PNG')
          image_width, image_height = struct.unpack('>II', og[16:24])
          width_match = re.search(r'<meta property="og:image:width" content="(\d+)">', index)
          height_match = re.search(r'<meta property="og:image:height" content="(\d+)">', index)
          if not width_match or not height_match:
              raise SystemExit('В index.html отсутствуют размеры og:image')
          meta_width, meta_height = int(width_match.group(1)), int(height_match.group(1))
          if (image_width, image_height) != (meta_width, meta_height):
              raise SystemExit(f'Размер OG не совпадает: PNG {image_width}x{image_height}, metadata {meta_width}x{meta_height}')

          required = [
              '<link rel="stylesheet" href="app.css">',
              '<script src="rates-data.js"></script>',
              '<script src="sources-data.js"></script>',
              '<script src="app.js"></script>',
          ]
          for marker in required:
              if marker not in index:
                  raise SystemExit(f'В index.html отсутствует {marker}')
          rate_pos = index.index('<script src="rates-data.js"></script>')
          source_pos = index.index('<script src="sources-data.js"></script>')
          app_pos = index.index('<script src="app.js"></script>')
          if not rate_pos < source_pos < app_pos:
              raise SystemExit('Нарушен порядок загрузки данных и app.js')
          if '<style>' in index:
              raise SystemExit('CSS снова встроен в index.html')
          print(f'KinoRates validation OK: {len(data)} rate records, {len(sources)} sources, {len(dom_refs)} DOM refs, OG {image_width}x{image_height}')
          PY
          ! grep -R -E 'FilmRate|FILMRATE_CHECKS|filmrate\.ru' -- app.js index.html scripts rates-data.js sources-data.js

  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить первоисточники
        id: monitor
        env:
          PUBLISH_CHECK: ${{ github.event.schedule == '0 10 1 * *' || inputs.publish_check }}
        run: python3 scripts/check_sources.py

      - name: Сохранить новые контрольные значения
        if: steps.monitor.outputs.changed == 'true' || steps.monitor.outputs.log_updated == 'true' || steps.monitor.outputs.state_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-state.json check-log.js
          git commit -m "Update KinoRates source check"
          git push

      - name: Создать уведомление для проверки
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-update --color B1443D --description "Изменение первоисточника" --force
          gh issue create \
            --title "Найдены обновления писем или ставок — $(date -u +%d.%m.%Y)" \
            --body-file source-change-report.md \
            --label source-update
