name: Проверка писем и ставок

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'rates-data.js'
      - 'sources-data.js'
      - 'updates.js'
      - 'check-log.js'
      - 'og-image.png'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/check-rate-sources.yml'
  workflow_dispatch:
    inputs:
      publish_check:
        description: "Добавить запись о проверке в журнал обновлений"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 10 1 * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write
  issues: write

concurrency:
  group: kinorates-source-monitor
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить структуру сайта и данные
        run: |
          node --check app.js
          node --check rates-data.js
          node --check sources-data.js
          node --check updates.js
          node --check check-log.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};vm.createContext(context);
          for(const file of ['rates-data.js','sources-data.js']){
            vm.runInContext(fs.readFileSync(file,'utf8'),context,{filename:file});
          }
          const data=context.window.KINORATES_DATA;
          const sources=context.window.KINORATES_SOURCES;
          if(!Array.isArray(data)||data.length!==449)throw new Error(`Каноническая база должна содержать ровно 449 позиций, получено: ${Array.isArray(data)?data.length:'not-array'}`);
          const ids=data.map(row=>row&&row.id);
          if(ids.some(id=>!Number.isSafeInteger(id))||new Set(ids).size!==ids.length)throw new Error('В базе отсутствуют ID или найдены дубли ID');
          const expectedKeys=['amount','amount_text','cond','content','dept','doc','eff','extra','id','ot','prof','region','src','status','unit'];
          const allowedStatuses=new Set(['fresh2026','official2026','market2025','check','newdoc','verified2025','verified2024','verified2023','archive','expired']);
          const verifiedStatuses=new Set(['fresh2026','official2026','verified2025','verified2024','verified2023']);
          for(const row of data){
            if(!row||typeof row!=='object')throw new Error('В базе есть некорректная запись');
            const keys=Object.keys(row).sort();
            if(keys.length!==expectedKeys.length||keys.some((key,index)=>key!==expectedKeys[index]))throw new Error(`Нарушена схема ставки id=${row.id}`);
            if(!row.dept||!row.prof||!row.unit||!row.status)throw new Error(`В ставке id=${row.id} отсутствует обязательное поле`);
            if(!allowedStatuses.has(row.status))throw new Error(`Неизвестный статус id=${row.id}: ${row.status}`);
            if(verifiedStatuses.has(row.status)&&!row.doc)throw new Error(`Подтвержденная ставка id=${row.id} не имеет ссылки на первоисточник`);
          }
          if(!Array.isArray(sources)||sources.length<29)throw new Error(`Подозрительный размер реестра источников: ${Array.isArray(sources)?sources.length:'not-array'}`);
          if(sources.some(source=>!source||typeof source!=='object'||!source.name||!source.date))throw new Error('В реестре источников есть некорректная запись');
          fs.writeFileSync('/tmp/kinorates-runtime-data.json',JSON.stringify({data,sources}));
          console.log(`Runtime data OK: ${data.length} rate records, ${sources.length} sources`);
          NODE
          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          app_js = Path('app.js').read_text(encoding='utf-8')
          runtime = json.loads(Path('/tmp/kinorates-runtime-data.json').read_text(encoding='utf-8'))
          data = runtime['data']
          sources = runtime['sources']

          legacy_data_tokens = [
              'CG_RATES_2023',
              'COLOR_CORRECTION_FIXES',
              'OPERATOR_POST_DOC',
              'STEADICAM_DOC',
              'SECOND_CAMERA_DOC',
              'SHOW_CAMERA_DOC',
              'FOCUS_PULLER_DOC',
              'DATA.push(',
              'DATA.splice(',
              'SRC.push(',
          ]
          stale_tokens = [token for token in legacy_data_tokens if token in app_js]
          if stale_tokens:
              raise SystemExit(f'В app.js снова появилась runtime-мутация канонической базы: {stale_tokens}')

          static_ids = set(re.findall(r'\bid=["\']([^"\']+)["\']', index))
          dom_refs = set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)', app_js))
          missing_dom_ids = sorted(dom_refs - static_ids)
          if missing_dom_ids:
              raise SystemExit(f'app.js ссылается на отсутствующие ID: {missing_dom_ids}')

          css = Path('app.css').read_text(encoding='utf-8')
          depth = 0
          quote = None
          comment = False
          i = 0
          while i < len(css):
              pair = css[i:i+2]
              if comment:
                  if pair == '*/': comment = False; i += 2; continue
                  i += 1; continue
              if not quote and pair == '/*': comment = True; i += 2; continue
              ch = css[i]
              if quote:
                  if ch == '\\': i += 2; continue
                  if ch == quote: quote = None
              else:
                  if ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth < 0: raise SystemExit('Лишняя закрывающая скобка в app.css')
              i += 1
          if comment or quote or depth:
              raise SystemExit('Незакрытая конструкция в app.css')

          og = Path('og-image.png').read_bytes()
          if og[:8] != b'\x89PNG\r\n\x1a\n' or og[12:16] != b'IHDR':
              raise SystemExit('og-image.png не является корректным PNG')
          image_width, image_height = struct.unpack('>II', og[16:24])
          width_match = re.search(r'<meta property="og:image:width" content="(\d+)">', index)
          height_match = re.search(r'<meta property="og:image:height" content="(\d+)">', index)
          if not width_match or not height_match:
              raise SystemExit('В index.html отсутствуют размеры og:image')
          meta_width, meta_height = int(width_match.group(1)), int(height_match.group(1))
          if (image_width, image_height) != (meta_width, meta_height):
              raise SystemExit(f'Размер OG не совпадает: PNG {image_width}x{image_height}, metadata {meta_width}x{meta_height}')

          required = [
              '<link rel="stylesheet" href="app.css">',
              '<script src="rates-data.js"></script>',
              '<script src="sources-data.js"></script>',
              '<script src="app.js"></script>',
          ]
          for marker in required:
              if marker not in index:
                  raise SystemExit(f'В index.html отсутствует {marker}')
          rate_pos = index.index('<script src="rates-data.js"></script>')
          source_pos = index.index('<script src="sources-data.js"></script>')
          app_pos = index.index('<script src="app.js"></script>')
          if not rate_pos < source_pos < app_pos:
              raise SystemExit('Нарушен порядок загрузки данных и app.js')
          if '<style>' in index:
              raise SystemExit('CSS снова встроен в index.html')
          print(f'KinoRates validation OK: {len(data)} canonical rate records, {len(sources)} sources, {len(dom_refs)} DOM refs, OG {image_width}x{image_height}')
          PY
          ! grep -R -E 'FilmRate|FILMRATE_CHECKS|filmrate\.ru' -- app.js index.html scripts rates-data.js sources-data.js

  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить первоисточники
        id: monitor
        env:
          PUBLISH_CHECK: ${{ github.event.schedule == '0 10 1 * *' || inputs.publish_check }}
        run: python3 scripts/check_sources.py

      - name: Сохранить новые контрольные значения
        if: steps.monitor.outputs.changed == 'true' || steps.monitor.outputs.log_updated == 'true' || steps.monitor.outputs.state_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-state.json check-log.js
          git commit -m "Update KinoRates source check"
          git push

      - name: Создать уведомление для проверки
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-update --color B1443D --description "Изменение первоисточника" --force
          gh issue create \
            --title "Найдены обновления писем или ставок — $(date -u +%d.%m.%Y)" \
            --body-file source-change-report.md \
            --label source-update
