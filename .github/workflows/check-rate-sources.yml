name: Проверка писем и ставок

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'rates-data.js'
      - 'updates.js'
      - 'check-log.js'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/check-rate-sources.yml'
  workflow_dispatch:
    inputs:
      publish_check:
        description: "Добавить запись о проверке в журнал обновлений"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 10 1 * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write
  issues: write

concurrency:
  group: kinorates-source-monitor
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить структуру сайта и базу ставок
        run: |
          node --check app.js
          node --check rates-data.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          data_js = Path('rates-data.js').read_text(encoding='utf-8')
          prefix = 'window.KINORATES_DATA = '
          if not data_js.startswith(prefix) or not data_js.rstrip().endswith(';'):
              raise SystemExit('Некорректная оболочка rates-data.js')
          data = json.loads(data_js[len(prefix):].strip()[:-1])
          if not isinstance(data, list) or len(data) < 300:
              raise SystemExit(f'Подозрительный размер базы: {len(data) if isinstance(data, list) else "not-list"}')
          ids = [row.get('id') for row in data if isinstance(row, dict)]
          if len(ids) != len(data) or len(ids) != len(set(ids)):
              raise SystemExit('В базе отсутствуют ID или найдены дубли ID')

          required = [
              '<link rel="stylesheet" href="app.css">',
              '<script src="rates-data.js"></script>',
              '<script src="app.js"></script>',
          ]
          for marker in required:
              if marker not in index:
                  raise SystemExit(f'В index.html отсутствует {marker}')
          if index.index('<script src="rates-data.js"></script>') > index.index('<script src="app.js"></script>'):
              raise SystemExit('app.js загружается раньше rates-data.js')
          if '<style>' in index:
              raise SystemExit('CSS снова встроен в index.html')
          print(f'KinoRates validation OK: {len(data)} rate records')
          PY
          ! grep -R -E 'FilmRate|FILMRATE_CHECKS|filmrate\.ru' -- app.js index.html scripts rates-data.js

  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить первоисточники
        id: monitor
        env:
          PUBLISH_CHECK: ${{ github.event.schedule == '0 10 1 * *' || inputs.publish_check }}
        run: python3 scripts/check_sources.py

      - name: Сохранить новые контрольные значения
        if: steps.monitor.outputs.changed == 'true' || steps.monitor.outputs.log_updated == 'true' || steps.monitor.outputs.state_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-state.json check-log.js
          git commit -m "Update KinoRates source check"
          git push

      - name: Создать уведомление для проверки
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-update --color B1443D --description "Изменение первоисточника" --force
          gh issue create \
            --title "Найдены обновления писем или ставок — $(date -u +%d.%m.%Y)" \
            --body-file source-change-report.md \
            --label source-update
