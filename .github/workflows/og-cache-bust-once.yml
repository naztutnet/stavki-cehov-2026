name: Update OG image URL once

on:
  push:
    paths:
      - '.github/workflows/og-cache-bust-once.yml'

permissions:
  contents: write

jobs:
  update-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update OG image URL
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://kinorates.ru/og-image.jpg'
          new = 'https://kinorates.ru/og-image-v2.jpg'
          count = text.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 OG URL occurrences, found {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/og-cache-bust-once.yml
          git commit -m "Use cache-busted KinoRates OG image"
          git push origin main
