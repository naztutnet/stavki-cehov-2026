    <style>
      @import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap');
      text { font-family: 'Golos Text', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1130" cy="-20" r="235" fill="#E9E4FF" opacity="0.78"/>
  <circle cx="1160" cy="650" r="255" fill="#F7EAD4" opacity="0.72"/>
  <circle cx="-40" cy="650" r="220" fill="#EAE5FF" opacity="0.40"/>

  <g transform="translate(62 46)">
